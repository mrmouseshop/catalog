<script>
'use strict';

/* ===================== НАСТРОЙКИ / ХРАНИЛИЩЕ ===================== */

const MS_BASE = "https://api.moysklad.ru/api/remap/1.2"; // реальный адрес МоегоСклада — только для meta.href внутри документов

const CONFIG = { workerUrl: '', token: '', orgId: '', storeId: '' };

// Тестовый прогон: все ЧТЕНИЯ (каталог, поиск контрагента, проверка дублей) идут по-настоящему
// в МойСклад — это и делает предпросмотр реалистичным, — а вот все ЗАПИСИ (создание отгрузки/
// платежа/списания/нового контрагента) подменяются на симуляцию. См. createDemand,
// createPaymentIn, createLoss и хвост getOrCreateCounterparty.
let DRY_RUN = false;
function drSuffix() {
  return DRY_RUN ? ' [🧪 СИМУЛЯЦИЯ — НЕ записано в МойСклад]' : '';
}

function loadConfig() {
  CONFIG.workerUrl = localStorage.getItem('ms_worker_url') || '';
  CONFIG.token = localStorage.getItem('ms_token') || '';
  CONFIG.orgId = localStorage.getItem('ms_org_id') || '';
  CONFIG.storeId = localStorage.getItem('ms_store_id') || '';
  document.getElementById('workerUrl').value = CONFIG.workerUrl;
  document.getElementById('token').value = CONFIG.token;
  document.getElementById('orgId').value = CONFIG.orgId;
  document.getElementById('storeId').value = CONFIG.storeId;
}

function saveConfig() {
  CONFIG.workerUrl = document.getElementById('workerUrl').value.trim().replace(/\/+$/, '');
  CONFIG.token = document.getElementById('token').value.trim();
  CONFIG.orgId = document.getElementById('orgId').value.trim();
  CONFIG.storeId = document.getElementById('storeId').value.trim();
  localStorage.setItem('ms_worker_url', CONFIG.workerUrl);
  localStorage.setItem('ms_token', CONFIG.token);
  localStorage.setItem('ms_org_id', CONFIG.orgId);
  localStorage.setItem('ms_store_id', CONFIG.storeId);
}

function configComplete() {
  return CONFIG.workerUrl && CONFIG.token && CONFIG.orgId && CONFIG.storeId;
}

function apiUrl(path) {
  return CONFIG.workerUrl + path;
}

function msHeaders() {
  return {
    'Authorization': 'Bearer ' + CONFIG.token,
    'Content-Type': 'application/json',
    'Accept': 'application/json;charset=utf-8',
  };
}

/* ===================== ЖУРНАЛ (аналог print() из питон-скрипта) ===================== */

const logEl = document.getElementById('log');
const logCountEl = document.getElementById('logCount');
let logLines = 0;

function log(msg) {
  console.log(msg);
  logLines++;
  logCountEl.textContent = logLines + ' строк';

  let cls = 'l-info';
  if (msg.includes('[OK]')) cls = 'l-ok';
  else if (msg.includes('❗ПРОВЕРЬТЕ ЦЕНУ') || msg.includes('[ПРЕДУПРЕЖДЕНИЕ]') || msg.includes('ПЛАТЁЖ НЕ СОЗДАН')) cls = 'l-warn';
  else if (msg.includes('[!!!]') || msg.includes('ОШИБКА') || msg.includes('НЕСОСТЫКОВКА')) cls = 'l-error';
  else if (msg.includes('СКИДКА')) cls = 'l-discount';
  else if (msg.includes('🎁') || msg.includes('ПОДАРОК')) cls = 'l-gift';
  // ОЗОН-заказы "ожидает сборки/отгрузки" — отгрузка создана, но НЕ проведена и без платежа
  // (см. processMarketplaceOrder). Красим отдельным цветом (⏳), ДО общей проверки "=>",
  // чтобы такая отгрузка визуально не сливалась с обычной успешно проведённой (l-success) —
  // на неё нужно обратить внимание и вернуться к ней в МоемСкладе, когда заказ будет собран.
  else if (msg.includes('⏳')) cls = 'l-pending';
  else if (msg.includes('[ПРОПУСК]')) cls = 'l-skip';
  else if (msg.trim().startsWith('=>')) cls = 'l-success';
  else if (!msg.startsWith(' ') && !msg.startsWith('Дата отгрузок')) cls = 'l-header';

  const line = document.createElement('div');
  line.className = cls;
  line.textContent = msg;
  logEl.appendChild(line);
  logEl.scrollTop = logEl.scrollHeight;
}

// Кликабельная ссылка в журнале — например, на реально созданный документ в МоемСкладе
// (вместо скриншота: настоящую страницу МойСклад из этого приложения не сделать без
// отдельного headless-браузера и хранения логина/пароля от сайта, а не API-токена —
// договорились вместо этого просто давать прямую ссылку на документ).
function logLink(msg, url) {
  console.log(msg, url);
  logLines++;
  logCountEl.textContent = logLines + ' строк';

  const line = document.createElement('div');
  line.className = 'l-link';
  const a = document.createElement('a');
  a.href = url;
  a.target = '_blank';
  a.rel = 'noopener noreferrer';
  a.textContent = msg;
  line.appendChild(a);
  logEl.appendChild(line);
  logEl.scrollTop = logEl.scrollHeight;
}

function clearLog() {
  logEl.innerHTML = '';
  logLines = 0;
  logCountEl.textContent = 'пусто';
}

/* ===================== ОКРУГЛЕНИЕ "КАК В PYTHON" (round half to even) ===================== */

function pyRound(x, ndigits) {
  ndigits = ndigits || 0;
  const factor = Math.pow(10, ndigits);
  const scaled = x * factor;
  const floor = Math.floor(scaled);
  const diff = scaled - floor;
  let rounded;
  if (Math.abs(diff - 0.5) < 1e-9) {
    rounded = (floor % 2 === 0) ? floor : floor + 1;
  } else {
    rounded = Math.round(scaled);
  }
  return rounded / factor;
}

/* ===================== КЭШ ТОВАРОВ ===================== */

let PRODUCTS_CACHE = {};
let ARTICLE_CACHE = {}; // товары по артикулу (для маркетплейс-заказов вроде ОЗОН, где ищем не по названию)

const DISCOUNT_EXCLUDE_KEYWORDS = []; // ручной список сверх основного правила (по умолчанию пуст)

async function loadProducts() {
  log('Загружаю базу товаров из МоегоСклада...');
  const resp = await fetch(apiUrl('/entity/product?limit=1000'), { headers: msHeaders() });
  if (!resp.ok) {
    log(`  [ОШИБКА API] Не удалось загрузить товары (код ${resp.status}): ${await resp.text()}`);
    throw new Error('load_products failed');
  }
  const data = await resp.json();
  PRODUCTS_CACHE = {};
  ARTICLE_CACHE = {};
  for (const item of (data.rows || [])) {
    const fullName = (item.name || '').trim();
    const salePrices = item.salePrices || [];
    const price = salePrices.length ? salePrices[0].value : 0;
    const buyPrice = (item.buyPrice && item.buyPrice.value) || 0;
    PRODUCTS_CACHE[fullName] = { meta: item.meta, price: price, buy_price: buyPrice };
    const article = (item.article || '').trim();
    if (article) {
      // Иногда в одно поле "Артикул" в МоемСкладе вписывают СРАЗУ НЕСКОЛЬКО кодов через
      // запятую/точку с запятой/слэш — например у одного товара может быть отдельный
      // артикул под каждую карточку на маркетплейсе ("THERAMEDNatur Weib3, Theramed3in1").
      // Регистрируем каждый код по отдельности, чтобы заказ с ЛЮБЫМ из них находил товар.
      const articleCodes = article.split(/[,;/]+/).map(s => s.trim()).filter(Boolean);
      for (const code of articleCodes) {
        ARTICLE_CACHE[code.toLowerCase()] = { meta: item.meta, price: price, buy_price: buyPrice, name: fullName };
      }
    }
  }
  log(`Загружено ${Object.keys(PRODUCTS_CACHE).length} товаров.`);
  for (const n in PRODUCTS_CACHE) {
    if (n.toLowerCase().includes('хамон')) log(`Найден в базе: '${n}'`);
  }
}

// Поиск товара по артикулу (точное совпадение, без учёта регистра) — используется для
// заказов с маркетплейсов (ОЗОН и т.п.), где в отчёте указан не человекочитаемое название
// товара, а внутренний артикул/SKU.
function findProductByArticle(article) {
  const key = (article || '').trim().toLowerCase();
  if (!key) return null;
  return ARTICLE_CACHE[key] || null;
}

/* ===================== ПОИСК ТОВАРА ПО НАЗВАНИЮ ИЗ ОТЧЁТА ===================== */

// Часть названий в каталоге (скопированных откуда-то с подменой раскладки) на самом деле
// набрана "смешанным" шрифтом — визуально латинские буквы на деле кириллические омоглифы,
// например "Rоdriguеz" (тут "о" и "е" — кириллица, выглядит как "Rodriguez", но байтово
// другая строка). Если в отчёте товар набран НОРМАЛЬНОЙ латиницей, посимвольное сравнение
// не совпадает, и товар не находится, хотя реально есть в каталоге. Сворачиваем такие
// омоглифы в латиницу — И у запроса, И у названия из каталога — так сравнение остаётся
// работать одинаково независимо от того, какой из вариантов набора попался.
const HOMOGLYPH_MAP = { 'а': 'a', 'е': 'e', 'о': 'o', 'р': 'p', 'с': 'c', 'у': 'y', 'х': 'x' };
function foldHomoglyphs(s) {
  return s.replace(/[аеорсух]/g, ch => HOMOGLYPH_MAP[ch]);
}

function findProductMeta(pRaw, weight) {
  let query = pRaw.toLowerCase().trim();

  // Пометку "[SALE]" убираем ещё ДО разбиения на слова для поиска — иначе она сама
  // становится обязательным словом запроса ("sale" длиннее 2 символов и попадает в
  // queryWords), а для товаров "хамон" порог совпадения строгий — 100% слов запроса
  // должны найтись в названии каталога. Каталожное название "sale" не содержит, и товар,
  // который иначе совпал бы идеально, тихо не находился вовсе (см. "Хамон Серрано набор
  // подарочный NICO 950гр [SALE]" — реальный товар в базе есть, но не находился).
  query = query.replace(/\[\s*sale\s*\]/gi, '').trim();

  if (query.includes('фуагра') && query.includes('150')) {
    query = 'фуагра ассорти 150гр';
  } else if (query.includes('фуагра') && (query.includes('130') || query.includes('130g'))) {
    query = 'фуагра ассорти 130гр';
  } else if (query.includes('бриет') || query.includes('briette')) {
    query = 'бриет briette (асс.) 125гр';
  }

  const queryClean = query.replace(/ä/g, 'a');

  for (const key in MANUAL_MAP) {
    if (queryClean.includes(key)) {
      const correctName = MANUAL_MAP[key];
      const correctNameClean = correctName.toLowerCase().replace(/ä/g, 'a');
      for (const fullName in PRODUCTS_CACHE) {
        const data = PRODUCTS_CACHE[fullName];
        const msNameClean = fullName.trim().toLowerCase().replace(/ä/g, 'a');
        if (msNameClean === correctNameClean) {
          return { name: fullName, meta: data.meta, price: data.price, buy_price: data.buy_price || 0 };
        }
      }
      log(`  [DEBUG] ВНИМАНИЕ: Словарь понял, что это '${correctName}', но не нашел точно такого названия в МС!`);
    }
  }

  const queryWords = query.split(/[^а-яa-z0-9]/).filter(w => w.length >= 3);
  const queryWordsFolded = queryWords.map(foldHomoglyphs);

  // Собираем ЛУЧШЕГО кандидата по всему каталогу, а не возвращаем первого попавшегося
  // (см. ниже про precision) — раньше первое совпадение, прошедшее порог, сразу
  // возвращалось через return, и порядок перебора PRODUCTS_CACHE (по сути случайный,
  // как отдаёт API) решал исход при нескольких подходящих карточках.
  let best = null;
  let bestPrecision = -1;

  for (const fullName in PRODUCTS_CACHE) {
    const data = PRODUCTS_CACHE[fullName];
    const nameLower = fullName.toLowerCase();
    const nameLowerFolded = foldHomoglyphs(nameLower);
    const matches = queryWordsFolded.filter(w => nameLowerFolded.includes(w)).length;
    const isHamon = query.includes('хамон');
    const threshold = isHamon ? 1.0 : 0.67;

    if (queryWords.length > 0 && (matches / queryWords.length >= threshold)) {
      // ВАЖНО: эти две проверки по фактическому взвешенному весу (250г vs 500г) задуманы
      // ТОЛЬКО для линейки Rodriguez (там реально есть блоки на 250г и 500г, и в отчёте
      // вес пишется по факту взвешивания куска, без явного "250гр"/"500гр" в тексте — то
      // есть текстовый грамм-токен-гард выше тут не поможет, нужен сигнал по факту веса).
      // Раньше проверка была БЕЗ этого ограничения и применялась ко ВСЕМ товарам — из-за
      // этого совершенно не связанный товар "Ландана 500" (где "500" — просто часть
      // названия, а не масса блока) при фактическом весе 0.295кг ошибочно исключался
      // ("500" в названии есть, "250" нет), и товар не находился вовсе.
      const isRodriguezFamily = nameLower.includes('родригес') || nameLower.includes('rodriguez');
      if (isRodriguezFamily) {
        if (weight && weight >= 0.4 && weight <= 0.6 && nameLower.includes('250') && !nameLower.includes('500')) continue;
        if (weight && weight >= 0.2 && weight <= 0.3 && nameLower.includes('500') && !nameLower.includes('250')) continue;
      }
      if (query.includes('родригес') && !nameLower.includes('родригес')) continue;
      // "Манчего DOP (18 мес)" (ВЕСОВОЙ, 420₽/100г) и "Манчего DOP (18 мес) 200гр"
      // (ШТУЧНАЯ фасовка, 1000₽/шт) — разные товары с почти одинаковым названием.
      // Проверка СИММЕТРИЧНАЯ: если в отчёте нет "200" — это весовая продажа, не даём
      // попасть на штучную фасовку; если "200" есть — наоборот, не даём попасть на
      // весовую. Раньше проверялась только первая половина, из-за чего запрос с явным
      // "200гр" всё равно мог попасть на весовой товар, если он шёл в кэше раньше.
      if (query.includes('манчего') && query.includes('18 мес')) {
        if (!query.includes('200') && nameLower.includes('200')) continue;
        if (query.includes('200') && !nameLower.includes('200')) continue;
      }
      // ВАЖНО: числа короче 3 символов (например "3", "9", "18") не попадают в queryWords
      // (см. фильтр length >= 3 выше) — то есть срок выдержки "N мес" сам по себе НИКАК
      // не участвует в подсчёте совпадений! Каталог реально содержит несколько сыров с
      // одним и тем же названием, но разным сроком — "Манчего DOP (3 мес)", "(9 мес)",
      // "(18 мес)" — и без этой проверки нечёткий поиск легко подставляет случайный из
      // них (например "(18 мес)" из отчёта отгружался как "(3 мес)" из каталога). Если и
      // в запросе, и в кандидате явно указано "N мес" — числа обязаны совпасть.
      // ВАЖНО: линейка Cantarelli в каталоге называется через ЛАТИНСКОЕ "mesi" (36mesi,
      // 48mesi, 60mesi, 70mesi), а в отчёте менеджеры часто пишут срок кириллицей ("30мес",
      // "40мес"). Без учёта латинского варианта регэксп видел возраст только у запроса, а у
      // названия из каталога — нет ("mesi" не совпадает с "мес"), проверка молча
      // пропускалась, и, например, "Пармезан 30мес Cantarelli" (которого вообще нет в
      // каталоге под таким сроком) тихо подставлялся как "48mesi" — на 600₽ дороже. Теперь
      // "мес"/"месяц" и "mesi" распознаются одинаково с обеих сторон.
      const ageRegex = /(\d+)\s*(?:мес\w*|mesi)/i;
      const queryAgeMatch = query.match(ageRegex);
      const nameAgeMatch = nameLower.match(ageRegex);
      if (queryAgeMatch && nameAgeMatch && queryAgeMatch[1] !== nameAgeMatch[1]) continue;

      // Некоторые товары существуют в каталоге как ДВЕ (или больше) отдельные карточки
      // разной заводской фасовки с весом прямо в названии — например "Пекорино Романо
      // Sepi ~300гр" и "Пекорино Романо Sepi ~900гр" — это разные товары, а не один
      // весовой сыр с примерным весом. Без этой проверки нечёткий поиск (порог 67% для
      // не-хамона) мог посчитать 3 из 4 слов совпавшими и вернуть ПЕРВУЮ карточку по
      // порядку в кэше, даже если вес в её названии не совпадает с весом в запросе —
      // например, отчёт "...Sepi ~900гр" тихо подставлялся как карточка "~300гр".
      // Как и с "мес"/"mesi" выше: если и в запросе, и в названии-кандидате явно указан
      // вес в граммах, числа обязаны совпасть.
      const gramRegex = /(\d+)\s*гр(?![а-яёА-ЯЁa-zA-Z])/;
      const queryGramMatch = query.match(gramRegex);
      const nameGramMatch = nameLower.match(gramRegex);
      if (queryGramMatch && nameGramMatch && queryGramMatch[1] !== nameGramMatch[1]) continue;

      // "Трюфель" — это НЕ вариация оформления, а признак совсем другого товара: набор/сыр
      // "с трюфелем" и такой же набор/сыр БЕЗ трюфеля — разные позиции по разной цене, а не
      // одна и та же карточка. Слово "трюфел..." достаточно длинное и заметное, чтобы нечёткий
      // поиск (порог 67% для не-хамона) всё равно засчитал кандидата почти идеальным при
      // совпадении ВСЕХ ОСТАЛЬНЫХ слов — например, отчёт "Набор La Taperia серрано резерва
      // С ТРЮФЕЛЕМ 950гр в деревянной подарочной коробке" ошибочно подставлялся как каталожный
      // "Набор La Taperia серрано резерва 950гр в деревянной подарочной коробке" (БЕЗ трюфеля,
      // на 500₽ дешевле) — единственное несовпавшее слово "трюфелем" просто игнорировалось.
      // Проверка СИММЕТРИЧНАЯ, как и у "мес"/"гр" выше: наличие "трюфел..." в запросе и в
      // названии-кандидате обязано совпадать в обе стороны.
      const queryHasTruffle = /трюфел/i.test(query);
      const nameHasTruffle = /трюфел/i.test(nameLower);
      if (queryHasTruffle !== nameHasTruffle) continue;

      // Каталог часто содержит подарочные наборы/комплекты, чьё длинное название
      // случайно включает в себя ВСЕ слова короткого запроса — например простой весовой
      // сыр "Манчего DOP (12 мес)" (запрос: "манчего", "dop", "мес") целиком укладывается
      // внутрь совсем другого товара "Набор Манчего с ножом и инжирным джемом 480гр (DOP
      // 12мес, иберико 3 молока, трюфель...)" — там тоже находятся все 3 слова. Раньше
      // побеждал ПЕРВЫЙ такой кандидат по порядку в кэше, то есть по сути случайно, и
      // весовой сыр мог отгрузиться как подарочный набор (другой товар, другая логика
      // списания склада). Чтобы выбрать самое ТОЧНОЕ совпадение, а не первое попавшееся,
      // среди всех кандидатов, прошедших порог, выбираем того, чьё название само по себе
      // наиболее полно "покрывается" словами запроса (precision = сколько слов из
      // названия угадано запросом) — простой сыр, чьё название почти целиком совпадает с
      // запросом, получает precision ~1.0, а набор с кучей лишних слов — низкий precision.
      const nameWords = nameLowerFolded.split(/[^а-яa-z0-9]/).filter(w => w.length >= 3);
      const precision = nameWords.length > 0 ? matches / nameWords.length : 0;

      if (precision > bestPrecision) {
        bestPrecision = precision;
        best = { name: fullName, meta: data.meta, price: data.price, buy_price: data.buy_price };
      }
    }
  }

  return best;
}

/* ===================== СКИДКИ ===================== */

function detectDiscountPercent(blockText) {
  // Строка описания ТОВАРА иногда содержит СВОЙ собственный процент скидки, привязанный
  // именно к этой позиции — например "(4.14) * 295₽/100гр = 12213 ₽ [одним куском] - 15%
  // = 10381" (компенсация за то, что кусок продан целиком, а не строго по заказанному
  // весу — а не акция на весь заказ). Если искать "-N%" по ВСЕМУ тексту заказа без
  // разбора, такая точечная скидка одной позиции ошибочно принимается за ОБЩУЮ скидку
  // заказа и применяется КО ВСЕМ товарам, включая те, которых она вообще не касается.
  // Поэтому процент ищем только в строках, которые НЕ являются описанием товара (не
  // начинаются с номера позиции и не содержат "цена за 100г" внутри себя) — то есть в
  // отдельных строках вида "Промокод: ...", "Скидка 15%", "(−5%) = −785₽" и т.п. Сама
  // точечная скидка конкретной позиции обрабатывается отдельно, при разборе её строки.
  const isItemLikeLine = (line) => /^\d+[)\.]\s+/.test(line) || /[*×]\s*\d+(?:[.,]\d+)?\s*(?:₽|руб)?\s*\/\s*100\s*г/i.test(line);
  const nonItemText = blockText.split('\n').filter(l => !isItemLikeLine(l.trim())).join('\n');
  const textLower = nonItemText.toLowerCase();

  let m = textLower.match(/(\d{1,2})\s*%\s*ск/);
  if (m) return parseInt(m[1], 10);

  // Ещё один порядок слов: "Скидка 5%" (слово "скидка" идёт ПЕРЕД числом, без минуса и
  // без "%" сразу после слова "ск..." — та строка не совпадает ни с этим паттерном, ни с
  // "-N%" ниже, и скидка молча не применялась вовсе, хотя менеджер её явно написал).
  m = textLower.match(/скидк[а-яё]*\s*:?\s*(\d{1,2})\s*%/);
  if (m) return parseInt(m[1], 10);

  // ВАЖНО: минус перед процентом не всегда обычный дефис "-" (U+002D) — в промокодах
  // (например, скопированных из другого приложения) он может оказаться "математическим"
  // знаком минус "−" (U+2212), который выглядит идентично, но не совпадает с обычным
  // дефисом побайтово. Ловим оба варианта, иначе скидка по промокоду молча теряется.
  m = textLower.match(/[-−]\s*(\d{1,2})\s*%/);
  if (m) return parseInt(m[1], 10);

  m = textLower.match(/\b\d{3,6}\s*[*×]\s*0[.,](\d{1,2})\b/);
  if (m) {
    const fracValue = parseFloat('0.' + m[1]);
    return Math.round((1 - fracValue) * 100);
  }
  return null;
}

// Иногда скидку пишут не процентом, а плоской суммой в рублях отдельной строкой,
// например "-150р" (без привязки к конкретному товару — общая уступка на заказ).
// Ловим ТОЛЬКО строку, целиком состоящую из "-<число>[р|руб|₽]" — если после числа
// есть что-то ещё (как в "-35р это был вычет прошлой переплаты"), это уже не сюда,
// такое не трогаем (слишком легко перепутать с чем-то другим).
function detectFlatDiscountRub(blockText) {
  const lines = blockText.split('\n');
  let totalRub = 0;
  let found = false;
  for (const raw of lines) {
    const line = raw.trim();
    const m = line.match(/^-\s*(\d+(?:[.,]\d+)?)\s*(?:р\.?|руб\.?|₽)?\s*$/i);
    if (m) {
      totalRub += parseFloat(m[1].replace(',', '.'));
      found = true;
    }
  }
  return found ? totalRub : null;
}

// Иногда скидку пишут как фиксированную сумму С ЕДИНИЦЫ ТОВАРА, например "Скидка 100р/шт"
// (в отличие от detectFlatDiscountRub — там сумма на весь заказ одной строкой без "/шт").
// Считаем это отдельно, а не долей от общей суммы заказа: раз скидка "с штуки", то и
// эквивалентный процент у каждого товара свой (зависит от его собственной цены), поэтому
// применяется индивидуально в месте вызова, а не одним числом на все позиции разом.
function detectFlatDiscountPerUnitRub(blockText) {
  const m = blockText.match(/скидка\D{0,10}(\d+(?:[.,]\d+)?)\s*(?:р|руб|₽)\.?\s*\/\s*шт/i);
  if (m) return parseFloat(m[1].replace(',', '.'));
  return null;
}

function isDiscountExcluded(item) {
  // Товар с пометкой "[SALE]" в отчёте уже отпущен по акционной цене сам по себе —
  // не удваиваем скидку поверх неё (см. _alreadyDiscounted, выставляется при разборе строки).
  if (item._alreadyDiscounted) return true;

  const nameLower = (item._name || '').toLowerCase();
  if (DISCOUNT_EXCLUDE_KEYWORDS.some(kw => nameLower.includes(kw))) return true;

  const catalogPrice = item._catalog_price;
  if (catalogPrice) {
    const tolerance = Math.max(100, catalogPrice * 0.01);
    if ((catalogPrice - item.price) > tolerance) return true;
  }
  return false;
}

/* ===================== ЦЕНА ИЗ ТЕКСТА ОТЧЁТА ===================== */

function extractTextPrice(content) {
  let priceRub = null;

  // ВАЖНО: новый формат отчёта иногда пишет знак умножения как "×" (U+00D7), а не "*" —
  // например "2 шт × 950₽ = 1900 ₽". Оба символа принимаются везде ниже.
  let m = content.match(/[*×]\s*(\d+(?:[.,]\d+)?)\s*(?:₽|[Рр])\s*\/\s*100\s*г/);
  if (m) {
    priceRub = parseFloat(m[1].replace(',', '.')) * 10;
  } else {
    m = content.match(/(\d+(?:[.,]\d+)?)\s*(?:₽|руб)\s*[*×]\s*\d+/);
    if (m) {
      priceRub = parseFloat(m[1].replace(',', '.'));
    } else {
      m = content.match(/[*×]\s*(\d+(?:[.,]\d+)?)\s*(?:₽|руб)(?!\s*\/\s*100)/);
      if (m) {
        priceRub = parseFloat(m[1].replace(',', '.'));
      } else {
        m = content.match(/[-–—]\s*(\d+(?:[.,]\d+)?)\s*(?:₽|руб)\s*(?:\(.*\))?\s*$/);
        if (m) priceRub = parseFloat(m[1].replace(',', '.'));
      }
    }
  }

  if (priceRub === null) return null;
  return pyRound(priceRub * 100);
}

function reportPriceMismatch(productName, textPriceKop, catalogPriceKop, stats) {
  const tolerance = Math.max(100, catalogPriceKop * 0.01);
  if (Math.abs(textPriceKop - catalogPriceKop) > tolerance) {
    const diffRub = (textPriceKop - catalogPriceKop) / 100;
    const sign = diffRub >= 0 ? '+' : '';
    log(`  [❗ПРОВЕРЬТЕ ЦЕНУ] '${productName}': в отчёте ${(textPriceKop / 100).toFixed(2)} ₽, в МоемСкладе ${(catalogPriceKop / 100).toFixed(2)} ₽ ` +
        `(разница ${sign}${diffRub.toFixed(2)} ₽). В документ поставлена цена ИЗ ОТЧЁТА — ` +
        `проверьте, не ошибся ли менеджер или не занизил цену.`);
    // Считаем в сводку итогов запуска (см. '=== ИТОГИ ЗАПУСКА ===' в processReport) — расхождение
    // цены иногда сигналит не об опечатке менеджера, а о том, что findProductMeta подставил
    // СОВСЕМ ДРУГОЙ товар (нечёткий поиск ошибся карточкой) — такое легко потерять в длинном
    // журнале, поэтому считаем и печатаем итог отдельной строкой, как и остальные несостыковки.
    if (stats) {
      stats.priceCheckCount = (stats.priceCheckCount || 0) + 1;
      stats.priceCheckDiffKop = (stats.priceCheckDiffKop || 0) + Math.abs(textPriceKop - catalogPriceKop);
    }
  }
}

/* ===================== ТЕЛЕФОН / КОНТРАГЕНТ ===================== */

function findPhone(text) {
  const match = text.match(/(?:\+7|8)(?:[\s\-\(\)‑–—]*\d){10}/);
  if (match) {
    let cleanPhone = match[0].replace(/\D/g, '');
    if (cleanPhone.startsWith('8')) cleanPhone = '7' + cleanPhone.slice(1);
    return '+' + cleanPhone;
  }
  return '';
}

async function getOrCreateCounterparty(name, phone) {
  const cleanPhone = phone ? phone.replace(/\D/g, '') : '';

  if (cleanPhone && cleanPhone.length >= 10) {
    const searchPhone = cleanPhone.slice(-10);
    const resp = await fetch(apiUrl('/entity/counterparty?search=' + encodeURIComponent(searchPhone)), { headers: msHeaders() });
    if (resp.ok) {
      const data = await resp.json();
      const rows = data.rows || [];
      if (rows.length) {
        log(`  [Контрагент] Найден по ТЕЛЕФОНУ: ${rows[0].name} (ID: ${rows[0].id})`);
        return rows[0].id;
      }
    }
  }

  let resp = await fetch(apiUrl('/entity/counterparty?search=' + encodeURIComponent(name)), { headers: msHeaders() });
  if (resp.ok) {
    const data = await resp.json();
    for (const row of (data.rows || [])) {
      if (row.name.toLowerCase() === name.toLowerCase()) {
        log(`  [Контрагент] Найден по точному ИМЕНИ: ${row.name}`);
        return row.id;
      }
    }
  }

  if (DRY_RUN) {
    log(`  [Контрагент] СОЗДАН НОВЫЙ${drSuffix()}: ${name} (Телефон: ${phone})`);
    return 'dryrun-cp-' + Math.random().toString(36).slice(2, 10);
  }

  const newCp = { name: name };
  if (phone) newCp.phone = phone;

  resp = await fetch(apiUrl('/entity/counterparty'), { method: 'POST', headers: msHeaders(), body: JSON.stringify(newCp) });
  if (resp.status === 200 || resp.status === 201) {
    const data = await resp.json();
    log(`  [Контрагент] СОЗДАН НОВЫЙ: ${name} (Телефон: ${phone})`);
    return data.id;
  } else {
    log(`  [ОШИБКА API] Не удалось создать контрагента '${name}'. ${await resp.text()}`);
    return null;
  }
}

/* ===================== ЗАЩИТА ОТ ПОВТОРНОГО ЗАПУСКА ===================== */

// Текст описания попадает в МойСклад через copy/paste из мессенджера на
// телефоне — по пути его может незаметно "подправить" автокоррекция iOS,
// пересылка сообщения в мессенджере и т.п.: неразрывные пробелы вместо
// обычных, "умные" тире/кавычки вместо обычных, лишние/задвоенные пробелы,
// разное количество пустых строк. Побайтовое сравнение через .trim() на
// это ловится и считает одно и то же описание "разным", из-за чего часть
// заказов в отчёте детектится как дубль, а часть (те, где текст чуть-чуть
// разъехался) — нет, и заказ создаётся заново. Поэтому сравниваем описания
// в максимально нормализованной форме.
function normalizeDescForCompare(s) {
  return (s || '')
    .replace(/ /g, ' ')                 // неразрывный пробел -> обычный
    .replace(/[‐-―−]/g, '-')  // разные виды тире/минуса -> дефис
    .replace(/[‘’‛]/g, "'")   // "умные" одинарные кавычки -> '
    .replace(/[“”„]/g, '"')   // "умные" двойные кавычки -> "
    .replace(/\s+/g, ' ')                    // любые пробелы/переносы строк -> один пробел
    .trim()
    .toLowerCase();
}

/* ===================== ИТОГО ИЗ ТЕКСТА ЗАКАЗА ===================== */

function extractReportTotalKopecks(blockText) {
  // Приоритет: строка "Суммарный итог" — она встречается, когда один клиент
  // фактически сделал НЕСКОЛЬКО под-заказов под одним заголовком (каждый со своим
  // "Итого:"), и в конце менеджер подводит ОБЩИЙ итог. Если её нет — берём первую
  // обычную строку "Итого:" (как раньше).
  // ВАЖНО: без проверки границы слова "итого" может случайно найтись ВНУТРИ другого
  // слова — например, в адресе "Магнитогорская улица 3" буквы "нитог" внутри слова
  // складываются ровно в "итого"! Тогда регэксп подхватывает мусор из адреса вместо
  // настоящей строки "Итого:", и сверка суммы полностью ломается. \b в JS не работает
  // с кириллицей (кириллица — не \w), поэтому границу слова проверяем вручную через
  // negative lookbehind/lookahead на кириллические/латинские буквы.
  const NOT_LETTER_BEFORE = '(?<![а-яёА-ЯЁa-zA-Z])';
  const NOT_LETTER_AFTER = '(?![а-яёА-ЯЁa-zA-Z])';

  // Менеджер иногда дописывает в саму строку итога ПРОСТОЕ отдельное пояснение в
  // скобках вида "Итого: 26000 (500 к след заказу)" или "Итого: 16500 (80р переплата)" —
  // это значит, что часть суммы на самом деле НЕ за этот заказ, а перенос/переплата,
  // которая зачтётся в следующем заказе, и её надо ВЫЧЕСТЬ при сверке с отгрузкой. Ловим
  // только скобки, целиком состоящие из "<число> к след(-ующему) заказу" или "<число>
  // переплата" — ничего больше внутри скобок быть не должно, иначе не матчится. А более
  // сложные пояснения-расшифровки вида "Итого: 18300 (20000-1700нал сдача и 139р к след
  // заказу)" — это РАСШИФРОВКА того, как получилось число 18300 (оно уже финальное,
  // ничего вычитать не нужно), а не дополнительная поправка сверху; такие скобки не
  // совпадают с carryoverRegex (там несколько чисел/арифметика), поэтому просто
  // выкидываем все скобки целиком и берём последнее оставшееся число.
  function extractOneTotalRub(tailRaw) {
    let carryoverRub = 0.0;
    const carryoverRegex = /\(\s*(\d+(?:[.,]\d+)?)\s*(?:р|руб)?\.?\s*(?:к\s+след[а-яё]*\s+заказ[а-яё]*|переплат[а-яё]*)\s*\)/gi;
    let cm;
    while ((cm = carryoverRegex.exec(tailRaw)) !== null) {
      carryoverRub += parseFloat(cm[1].replace(',', '.'));
    }
    const tail = tailRaw.replace(/\([^)]*\)/g, ' ');
    const nums = tail.match(/\d+(?:[.,]\d+)?/g);
    if (!nums || !nums.length) return null;
    return parseFloat(nums[nums.length - 1].replace(',', '.')) - carryoverRub;
  }

  // Приоритет 1: "Суммарный итог" / "Итого суммарно" (порядок слов может быть любым) —
  // встречается, когда один клиент фактически сделал НЕСКОЛЬКО под-заказов под одним
  // заголовком (каждый со своим "Итого:"), и в конце менеджер подводит ОБЩИЙ итог.
  // ВАЖНО: без проверки границы слова "итого" может случайно найтись ВНУТРИ другого
  // слова — например, в адресе "Магнитогорская улица 3" буквы "нитог" внутри слова
  // складываются ровно в "итого"! Тогда регэксп подхватывает мусор из адреса вместо
  // настоящей строки "Итого:", и сверка суммы полностью ломается. \b в JS не работает
  // с кириллицей (кириллица — не \w), поэтому границу слова проверяем вручную через
  // negative lookbehind/lookahead на кириллические/латинские буквы.
  let itogoRub = null;
  const mSum = blockText.match(new RegExp(NOT_LETTER_BEFORE + '(?:суммарный\\s+итог[а-яё]*|итог[а-яё]*\\s+суммарно)' + NOT_LETTER_AFTER + '\\s*:?\\s*(.+)', 'i'));
  if (mSum) itogoRub = extractOneTotalRub(mSum[1]);

  if (itogoRub === null) {
    // Приоритет 2: обычные строки "Итого:" — если "Суммарный итог"/"Итого суммарно" нет,
    // но при этом строк "Итого:" НЕСКОЛЬКО (несколько под-заказов под одним клиентом без
    // явного общего итога), складываем ВСЕ такие строки — это то, что реально причитается
    // к оплате за весь блок целиком. Если строка "Итого:" всего одна — поведение как раньше.
    // ВАЖНО: менеджер иногда дублирует ОДНУ И ТУ ЖЕ сумму — сначала как "превью" сразу
    // после заголовка заказа (ДО списка товаров), а затем ещё раз как настоящий итог ПОСЛЕ
    // списка товаров и доставки. Если считать обе строки, сумма задвоится (наблюдалось на
    // реальном отчёте: "Итого: 12000₽" дважды -> ложные 24000 вместо 12000). Поэтому строка
    // "Итого:" учитывается в сумме только если ДО неё в блоке уже встретилась хотя бы одна
    // пронумерованная строка товара ("1. ...", "2) ..." и т.п.) — то есть это итог уже
    // ПОСЛЕ перечисления товаров, а не предварительный анонс суммы.
    const blockLines = blockText.split('\n');
    const itemLineRegex = /^\s*\d+[)\.]\s+/;
    const itogoLineOnlyRegex = new RegExp(NOT_LETTER_BEFORE + 'итого' + NOT_LETTER_AFTER + '\\s*:?\\s*(.+)', 'i');
    let seenItemLine = false;
    let sumRub = 0;
    let count = 0;
    for (const rawLine of blockLines) {
      if (itemLineRegex.test(rawLine)) { seenItemLine = true; continue; }
      if (!seenItemLine) continue;
      const im = rawLine.match(itogoLineOnlyRegex);
      if (im) {
        const val = extractOneTotalRub(im[1]);
        if (val !== null) { sumRub += val; count++; }
      }
    }
    if (count > 0) itogoRub = sumRub;
  }

  if (itogoRub === null) {
    // Новый формат отчёта у некоторых заказов вообще не пишет "Итого:" — вместо него
    // только "Подытог:" (сумма ДО промокода/скидки) и "К оплате: N ₽" (финальная сумма
    // после скидки — то, что реально нужно для сверки). Используем "К оплате" только как
    // запасной вариант, когда обычного "Итого:" нет вообще, иначе рискуем перепутать с
    // многополучательской строкой вида "К оплате: 25800 ₽ (Климу) + 800 ₽ (Насте)".
    const mKOplate = blockText.match(new RegExp(NOT_LETTER_BEFORE + 'к\\s+оплате' + NOT_LETTER_AFTER + '\\s*:?\\s*(.+)', 'i'));
    if (mKOplate) itogoRub = extractOneTotalRub(mKOplate[1]);
  }

  if (itogoRub === null) return null;

  let deliveryRub = 0.0;
  // ВАЖНО: \w в JS матчит только [A-Za-z0-9_] (в отличие от Python, где \w матчит
  // и кириллицу). Поэтому здесь нужен явный класс кириллических букв, иначе
  // "доставка"/"доставки" не находится и доставка не вычитается из "Итого".
  // Строка доставки не всегда простая ("Доставка: 1620") — иногда это длинное
  // описание условия доставки/комиссии, например "Доставка заказа суммой до 5тр в
  // пункт отправления СДЭК из Москвы - 250 (комиссия по условиям магазина)". Поэтому
  // берём ПОСЛЕДНЕЕ число во всей строке "Доставка..." (после удаления скобок), а не
  // требуем, чтобы число шло сразу после слова "доставка".
  //
  // ВАЖНО: строка обязательно должна НАЧИНАТЬСЯ со слова "доставк..." (после
  // необязательных пробелов) — раньше искали "доставк..." ГДЕ УГОДНО в блоке, и это
  // ошибочно попадало на строку "День доставки: 23.09.26" (там есть отдельная дата
  // доставки, а не её стоимость!), если она шла в отчёте РАНЬШЕ настоящей строки
  // "Доставка: 680₽". Число "26" (конец даты "23.09.26") тогда принималось за стоимость
  // доставки вместо 680 — и это ломало сверку суммы по позициям с "Итого" (ложная
  // "[❗НЕСОСТЫКОВКА]" и заблокированный платёж на ровном месте).
  const dLineMatch = blockText.match(new RegExp('^[^\\S\\n]*доставк[а-яё]*[^\\n]*', 'im'));
  if (dLineMatch) {
    const dLine = dLineMatch[0].replace(/\([^)]*\)/g, ' ');
    const dNums = dLine.match(/\d+(?:[.,]\d+)?/g);
    if (dNums && dNums.length) deliveryRub = parseFloat(dNums[dNums.length - 1].replace(',', '.'));
  }

  // Иногда "Итого:" в отчёте — это сумма ТОЛЬКО за товары (ДО добавления доставки), а
  // реальный итог с доставкой указан отдельно в "К оплате:" (например "Итого: 7189₽" +
  // "Доставка: 211₽" = "К оплате: 7400"). В большинстве же других заказов "Итого:" уже
  // ВКЛЮЧАЕТ доставку, и тогда вычитание доставки из Итого как раз даёт нужную сумму за
  // товары. Различить эти два случая можно по формуле: если "К оплате" ПРИМЕРНО равно
  // "Итого" + "Доставка" (с точностью до рубля округления), значит доставка ещё не была
  // прибавлена к Итого — и тогда её вычитать из Итого НЕ нужно (иначе доставка спишется
  // дважды и появится ложное расхождение при сверке).
  const mKOplateCheck = blockText.match(new RegExp(NOT_LETTER_BEFORE + 'к\\s+оплате' + NOT_LETTER_AFTER + '\\s*:?\\s*(.+)', 'i'));
  if (mKOplateCheck) {
    const kOplateRub = extractOneTotalRub(mKOplateCheck[1]);
    if (kOplateRub !== null && Math.abs((itogoRub + deliveryRub) - kOplateRub) < 1) {
      deliveryRub = 0;
    }
  }

  // "Мусорные" суммы (не товар, вычитаются из Итого): аккумулятор холода/термопакет
  // (обычно "= 100₽" ИЛИ просто "— 100₽" без знака "=") и комиссия магазина за
  // отправку/доставку (не содержит слова "доставка", поэтому не ловится dLineMatch
  // выше, например "Комиссия магазина на отправку заказа суммой <5000₽ тк СДЭК: 250₽").
  // Берём ПОСЛЕДНЕЕ число в строке (после удаления скобок) — как и для "доставки" —
  // чтобы не спутать с числами вроде "<5000₽" внутри условия комиссии.
  let junkRub = 0.0;
  const junkLineRegex = new RegExp(NOT_LETTER_BEFORE + '(?:аккумулятор|термопакет|комиссия)[а-яё]*[^\\n]*', 'gi');
  let jm;
  while ((jm = junkLineRegex.exec(blockText)) !== null) {
    const jLine = jm[0].replace(/\([^)]*\)/g, ' ');
    const jNums = jLine.match(/\d+(?:[.,]\d+)?/g);
    if (jNums && jNums.length) junkRub += parseFloat(jNums[jNums.length - 1].replace(',', '.'));
  }

  const goodsRub = itogoRub - deliveryRub - junkRub;
  return pyRound(goodsRub * 100);
}

function stripInternalFields(items) {
  return items.map(it => {
    const out = {};
    for (const k in it) if (!k.startsWith('_')) out[k] = it[k];
    return out;
  });
}

// ВАЖНО: параметр opts.applicable (по умолчанию true) управляет галочкой "проведено" в
// МоемСкладе. Заказы ОЗОН в статусе "ожидает сборки"/"ожидает отгрузки" ещё не готовы к
// фактической отправке — отгрузку заводим (чтобы был документ с позициями), но НЕПРОВЕДЁННОЙ,
// чтобы она не списывала товар со склада раньше времени; см. processMarketplaceOrder.
async function createDemand(cId, items, dateStr, descText, opts) {
  const applicable = !opts || opts.applicable !== false;
  if (DRY_RUN) {
    const sum = pyRound(items.reduce((s, it) => s + it.quantity * it.price * (1 - (it.discount || 0) / 100), 0));
    return { meta: { href: 'dryrun-demand-' + Math.random().toString(36).slice(2, 10) }, sum, applicable };
  }
  const payload = {
    organization: { meta: { href: `${MS_BASE}/entity/organization/${CONFIG.orgId}`, type: 'organization' } },
    agent: { meta: { href: `${MS_BASE}/entity/counterparty/${cId}`, type: 'counterparty' } },
    store: { meta: { href: `${MS_BASE}/entity/store/${CONFIG.storeId}`, type: 'store' } },
    moment: `${dateStr} 12:00:00`,
    description: descText,
    applicable,
    positions: stripInternalFields(items),
  };
  const resp = await fetch(apiUrl('/entity/demand'), { method: 'POST', headers: msHeaders(), body: JSON.stringify(payload) });
  if (resp.status === 200 || resp.status === 201) return await resp.json();
  log(`  !!! ОШИБКА МС (Код ${resp.status}): ${await resp.text()}`);
  return null;
}

  if (DRY_RUN) return true;
  const payload = {
