/* ===================== АВТО-ИСПРАВЛЕНИЕ "СЛИПШИХСЯ" СТРОК ===================== */

// Иногда описание товара переносится на следующую строку прямо посреди скобочного
// уточнения — например:
//   "2. Ассорти La Taperia Иберико 150гр
//   (Хамон Иберико, Чоризо Иберико, Сальсичон Иберико) — 950 ₽"
// Без склейки обе строки проходят проверку isItem по отдельности (у обеих есть текст +
// у второй есть цена) и превращаются в ДВА разных товара: первая половина (без скобки)
// нечётким поиском попадает на ДРУГОЙ, более короткий вариант товара (например
// "Ассорти La Taperia 150гр (Хамон Серрано, Чоризо, Салями)" вместо Иберико-версии), а
// вторая половина — сама скобка "(Хамон Иберико, ...)" — ищется как САМОСТОЯТЕЛЬНОЕ
// название товара (случайно попадает на правильный катАложный товар, т.к. тот же
// текст есть в его полном названии). В сумме это ДВОЙНАЯ отгрузка/списание вместо одной
// позиции. Склеиваем такую строку-скобку обратно к предыдущей строке ДО основного
// разбора: если строка целиком начинается с "(" и содержит буквы (не просто "(1.24)" —
// весовой довесок к ТОЙ ЖЕ строке уже обрабатывается отдельным механизмом ниже, там букв
// нет), а у предыдущей строки ещё нет цены (₽/руб) — значит, предыдущая строка
// оборвалась на середине названия, и эту скобку нужно дописать к ней.
function mergeParentheticalContinuations(lines) {
  const merged = [];
  for (const line of lines) {
    if (
      merged.length > 0 &&
      /^\(/.test(line) &&
      /[а-яёА-ЯЁa-zA-Z]/.test(line) &&
      !/(₽|руб)/i.test(merged[merged.length - 1])
    ) {
      merged[merged.length - 1] = merged[merged.length - 1] + ' ' + line;
    } else {
      merged.push(line);
    }
  }
  return merged;
}

function unglueFusedItemMarkers(text) {
  // Менеджер иногда забывает нажать Enter перед новой позицией, и маркер вида "1) "
  // слипается с концом предыдущей строки — чаще всего с номером телефона, например:
  // "...245-60-651) Хамон Себо Иберико LEGADO Блок ~2.5кг - ..." (тут "1)" — на
  // самом деле начало новой позиции, просто без переноса строки).
  //
  // Вставляем перенос строки перед таким маркером, если:
  //  - маркер НЕ идёт с начала строки (значит, он к чему-то приклеился) —
  //    и, ВАЖНО, символ перед ним не цифра, иначе можно случайно "распилить"
  //    обычный двузначный номер позиции/заказа (например, "10. ОПЛАЧЕН" —
  //    без этого условия регэксп нашёл бы "10" неподходящим (после \n нельзя),
  //    но потом ошибочно "сматчился" бы прямо на "0." внутри "10.", раздербанив
  //    его на "1" + "0. ОПЛАЧЕН");
  //  - сразу после маркера — БУКВА (название товара), а не ещё одна цифра —
  //    это отсекает даты вида "13.08" и дробные веса вида "4.5кг", где после
  //    точки идут цифры, а не название товара;
  //  - и до конца ЭТОЙ ЖЕ строки (до настоящего переноса) есть признак цены
  //    (₽/руб или "* число") — иначе регэксп ложно "распиливает" обычный текст
  //    адреса/времени в духе "...домофон 20. Время: 22 августа с 14 до 18." —
  //    там после "20." тоже цифра+точка+заглавная буква, но это НЕ начало
  //    позиции товара, а обычное предложение, и без этой проверки кусок текста
  //    "Время: 22 августа..." ошибочно улетает в парсер как несуществующий товар.
  return text.replace(/(?<![\n\d])(\d+[)\.]\s*(?=[А-ЯЁа-яёA-Za-z][^\n]*?(?:₽|руб\b|\*\s*\d)))/g, '\n$1');
}

/* ===================== ЗАКАЗЫ МАРКЕТПЛЕЙСОВ (ОЗОН И Т.П.) ===================== */

// Формат (пример):
//   1.1 ОЗОН
//   0107892035-0132-1        <- номер заказа ОЗОН, используем как контрагента
//   Доставляется              <- не важно
//   2 шт, Mostarda_Fichi_120g <- количество, артикул товара в МоемСкладе
//   1 300 ₽                   <- сумма, не сверяем с каталогом — просто проводим платёж
// Некоторые артикулы ОЗОН — это не единица товара 1:1, а карточка-НАБОР, физически состоящая
// из нескольких штук базового товара в МоемСкладе (например, артикул "Theramed3in1" продаёт
// сразу 3 тюбика пасты Theramed одним лотом). Для таких артикулов "1 шт" в заказе ОЗОН нужно
// превращать в кратное количество при отгрузке фактического товара со склада — иначе спишется
// только 1 шт вместо реальных 3. Ключи — артикул ОЗОН в нижнем регистре, значение — множитель.
const OZON_ARTICLE_QTY_MULTIPLIER = {
  'theramed3in1': 3,
  'theramednatur weib3': 3,
  'theramedatem-frisch3': 3,
  'theramedoriginal3': 3,
  'vilagran_martiko_130g': 2,
  'martiko_vilagran_soroa_130g': 3,
  'special_and_deleitum_150g': 2,
};

async function processMarketplaceOrder(header, block, lines, reportDate, stats = { mismatchKop: 0, mismatchOrders: 0, missingPayments: 0, lossDocs: 0, priceCheckCount: 0, priceCheckDiffKop: 0 }) {
  const cpRaw = lines[0] || 'OZON';
  const fullDesc = `${header}\n${block.trim()}`;

  // Статус "Отменен" — заказ ОЗОН отменён маркетплейсом. Ничего со склада списывать и
  // платёж проводить НЕ нужно (товар не уехал, денег не было), но контрагента (номер
  // заказа) и "пустой" документ-заметку с комментарием всё равно заводим — чтобы был след
  // в МоемСкладе и повторный прогон отчёта не пытался обработать этот заказ снова.
  const isCancelled = lines.some(l => /отмен[её]н/i.test(l));

  // Статусы "Ожидает сборки" и "Ожидает отгрузки" — заказ ОЗОН ещё не собран/не передан в
  // доставку, товар физически ещё на складе. Отгрузку заводим уже сейчас (чтобы позиции были
  // видны), но галочку "проведено" оставляем СНЯТОЙ (непроведённый документ не списывает товар
  // со склада) и входящий платёж НЕ создаём — деньги/факт отгрузки ещё не подтверждены.
  // ВАЖНО: проверка дублей (demandAlreadyExists ниже) находит документ по тексту заказа — если
  // тот же заказ попадёт в следующий отчёт уже с финальным статусом ("Доставляется" и т.п.), он
  // будет распознан как уже существующий и просто пропущен, а НЕ дозаведён платежом
  // автоматически. Когда статус в реальности сменится, документ нужно будет проверить/провести
  // и добавить платёж вручную в МоемСкладе (или удалить черновик и прогнать отчёт заново).
  const isPendingStatus = lines.some(l => /ожидает\s+(?:сборки|отгрузки)/i.test(l));

  // Иногда в ОДНОМ заказе ОЗОН склеено НЕСКОЛЬКО разных товаров — каждая пара
  // "N шт, артикул" на своей строке — а не только одна позиция. Раньше бралась только
  // ПЕРВАЯ такая строка (break сразу после неё), и вторая/третья позиция тихо терялась —
  // товар со склада не списывался вообще. Теперь собираем ВСЕ такие строки.
  const ozonLines = [];
  for (const line of lines) {
    const m = line.match(/^(\d+(?:[.,]\d+)?)\s*шт\.?\s*,\s*(.+)$/i);
    if (m) {
      ozonLines.push({ qty: parseFloat(m[1].replace(',', '.')), article: m[2].trim() });
    }
  }

  if (!ozonLines.length && !isCancelled) {
    log(`  [!!!] ОЗОН: в заказе [${header}] не нашлась строка "N шт, артикул" — пропускаю, проведите вручную.`);
    return;
  }

  const cId = await getOrCreateCounterparty(cpRaw, '');
  if (!cId) return;

  if (await demandAlreadyExists(cId, reportDate, fullDesc)) {
    log(`  [ПРОПУСК] Отгрузка ОЗОН [${header}] уже есть в МоемСкладе — дубль не создаю.`);
    return;
  }

  if (isCancelled) {
    const demandResult = await createDemand(cId, [], reportDate, fullDesc);
    if (!demandResult) {
      log(`  [ОШИБКА API] МойСклад не смог создать документ для отменённого заказа ОЗОН [${header}].`);
      return;
    }
    log(`  [ОЗОН ОТМЕНЁН] Заказ [${header}] (${cpRaw}) отменён — создан пустой документ (контрагент + комментарий), без товаров и платежа.${drSuffix()}`);
    return;
  }

  const newItems = [];
  for (const { qty, article } of ozonLines) {
    const productData = findProductByArticle(article);
    if (!productData) {
      log(`  [!!!] ВНИМАНИЕ: ОЗОН-товар с артикулом '${article}' не найден в МоемСкладе! Заказ [${header}] — проведите вручную.`);
      continue;
    }
    const qtyMultiplier = OZON_ARTICLE_QTY_MULTIPLIER[article.toLowerCase()] || 1;
    const shipQty = qty * qtyMultiplier;
    if (qtyMultiplier !== 1) {
      log(`  [OZON] Артикул '${article}' — это набор x${qtyMultiplier}: в отгрузку идёт ${shipQty} шт (${qty} шт заказа ОЗОН × ${qtyMultiplier}).`);
    }
    log(`  [OZON] Артикул '${article}' найден как '${productData.name}' (Кол-во: ${shipQty})`);
    newItems.push({ quantity: shipQty, assortment: { meta: productData.meta }, price: productData.price, _name: productData.name });
  }

  if (!newItems.length) {
    log(`  [ПРОПУСК] Ни один товар из заказа ОЗОН [${header}] не найден в МоемСкладе — отгрузка не создана.`);
    return;
  }

  const demandResult = await createDemand(cId, newItems, reportDate, fullDesc, { applicable: !isPendingStatus });
  if (!demandResult) {
    log(`  [ОШИБКА API] МойСклад не смог создать отгрузку ОЗОН для [${header}].`);
    stats.missingPayments++;
    return;
  }
  if (isPendingStatus) {
    // ⏳ — отдельный маркер (см. классификатор log() выше): красим оранжевым, а не зелёным,
    // как обычную успешную отгрузку, чтобы такие заказы бросались в глаза в журнале и их не
    // забыли провести/оплатить вручную в МоемСкладе, когда заказ реально соберут/отгрузят.
    log(`  ⏳ Отгрузка ОЗОН [${header}] (${cpRaw}) СОЗДАНА, НО НЕ ПРОВЕДЕНА — статус "ожидает сборки/отгрузки". Платёж не создан — вернитесь к заказу, когда он будет собран/отгружен.${drSuffix()}`);
    stats.missingPayments++;
    return;
  }

  log(`  => Отгрузка ОЗОН [${header}] (${cpRaw}) успешно создана!${drSuffix()}`);

  // ВАЖНО: для заказов ОЗОН сумму/"Итого", написанную в самом отчёте, ИГНОРИРУЕМ
  // полностью — она отражает розничную цену маркетплейса, а не то, что реально должно
  // списаться в МоемСкладе. Отгружаем и проводим платёж строго по каталожной цене товара
  // (как уже стоит в позициях newItems выше) — то есть "как есть в МоемСкладе", без
  // подгонки суммы под число из отчёта.
  const itemsSum = pyRound(newItems.reduce((s, it) => s + it.quantity * it.price, 0));
  const paymentSum = demandResult.sum !== undefined ? demandResult.sum : itemsSum;

  if (await paymentAlreadyExists(cId, reportDate, fullDesc)) {
    log(`  [ПРОПУСК] Входящий платёж ОЗОН для [${header}] уже есть в МоемСкладе — дубль не создаю.`);
    return;
  }
  if (await createPaymentIn(cId, demandResult.meta, paymentSum, reportDate, fullDesc)) {
    log(`  => 💰 Входящий платёж ОЗОН на ${(paymentSum / 100).toFixed(2)} ₽ для [${header}] создан.${drSuffix()}`);
  } else {
    log(`  [ОШИБКА API] МойСклад не смог создать платёж ОЗОН для [${header}].`);
    stats.missingPayments++;
  }
}

/* ===================== ГЛАВНАЯ ОБРАБОТКА ОТЧЁТА ===================== */

async function processReport(reportTextRaw) {
  const reportText = unglueFusedItemMarkers(reportTextRaw);
  const dateMatch = reportText.match(/(\d{1,2})\.(\d{2})/);
  let reportDate;
  if (dateMatch) {
    const day = dateMatch[1].padStart(2, '0');
    const month = dateMatch[2];
    const year = new Date().getFullYear(); // берём текущий год динамически (в питон-версии год был захардкожен)
    reportDate = `${year}-${month}-${day}`;
  } else {
    reportDate = new Date().toISOString().slice(0, 10);
  }

  // В конце дня, СРАЗУ после общего "Итого: N" и "Выручка: N" (грандтотал всего дня),
  // часто идёт справочный блок "Доставки Максим ДД.ММ - N" со СПИСКОМ заказов для курьера
  // на сегодня — включая заказы из ПРОШЛЫХ дней. Заголовки там выглядят точно так же
  // ("1. ОПЛАЧЕН", "2. ОПЛАЧЕН"...), поэтому без этой отсечки код принимает их за НОВЫЕ
  // заказы и пытается обработать повторно (спасает только то, что там обычно нет товарных
  // строк — но полагаться на удачу нельзя). Поэтому всё, что идёт после дневного
  // "Итого:\nВыручка:", в разбор заказов не попадает.
  const NOT_LETTER_BEFORE_TRAIL = '(?<![а-яёА-ЯЁa-zA-Z])';
  const NOT_LETTER_AFTER_TRAIL = '(?![а-яёА-ЯЁa-zA-Z])';
  const trailerMatch = reportText.match(new RegExp(
    NOT_LETTER_BEFORE_TRAIL + 'итого' + NOT_LETTER_AFTER_TRAIL + '\\s*:?\\s*\\d+(?:[.,]\\d+)?\\s*\\r?\\n\\s*' +
    NOT_LETTER_BEFORE_TRAIL + 'выручка' + NOT_LETTER_AFTER_TRAIL + '\\s*:?\\s*\\d+(?:[.,]\\d+)?',
    'i'
  ));
  const ordersSectionText = trailerMatch ? reportText.slice(0, trailerMatch.index) : reportText;

  // Заказы с маркетплейсов (ОЗОН и т.п.) оформлены заголовком вида "1.1 ОЗОН" —
  // добавляем как отдельную альтернативу заголовка, наравне с "N. ОПЛАЧЕН".
  const ordersRaw = ordersSectionText.split(/(?:\n|^)\s*(\d+\.\d+\s*ОЗОН[^\n]*|\d+\.\s*(?:НЕ\s*)?О[Р]?ПЛАЧЕН[^\n]*|0\.\d+\s+|\d+\.\s*(?=[Гг]риша))/);
  const orders = [];
  for (let i = 1; i < ordersRaw.length; i += 2) {
    const header = (ordersRaw[i] || '').trim();
    const body = (ordersRaw[i + 1] || '').trim();
    orders.push([header, body]);
  }

  log(`Дата отгрузок: ${reportDate}. Найдено заказов: ${orders.length}`);

  // Сводная статистика по всему запуску — печатается коротким блоком в самом конце
  // (см. итоговый вывод перед 'Готово.'), чтобы не листать весь длинный журнал в поисках
  // несостыковок/непроведённых платежей вручную.
  const stats = { mismatchKop: 0, mismatchOrders: 0, missingPayments: 0, lossDocs: 0, priceCheckCount: 0, priceCheckDiffKop: 0 };

  for (const [header, block] of orders) {
    const lines = mergeParentheticalContinuations(block.trim().split('\n').map(l => l.trim()).filter(l => l));
    if (!lines.length) continue;

    // --- ЗАКАЗЫ МАРКЕТПЛЕЙСОВ (ОЗОН и т.п.) ---
    // Формат совсем другой: нет имени клиента (только номер заказа маркетплейса,
    // используем его же как контрагента), товар ищем по АРТИКУЛУ (не по названию),
    // а цену/сумму из отчёта не проверяем — просто проводим платёж на неё.
    if (/ОЗОН/i.test(header)) {
      await processMarketplaceOrder(header, block, lines, reportDate, stats);
      continue;
    }

    // Иногда статус заказа ("ОПЛАЧЕН" и т.п.) случайно продублирован ЕЩЁ РАЗ отдельной
    // строкой сразу после заголовка (человеческий фактор при копировании отчёта) —
    // например заголовок "5. ОПЛАЧЕН", а следующая строка блока — снова просто "ОПЛАЧЕН".
    // Без этой проверки такая строка ошибочно бралась за имя клиента, и контрагент в
    // МоемСкладе создавался под именем "ОПЛАЧЕН" вместо настоящего. Пропускаем такие
    // строки-дубликаты статуса при поиске строки с именем.
    //
    // ВАЖНО: заголовки вида "0.N " (в отличие от обычных "N. ОПЛАЧЕН...") ловятся отдельной,
    // "короткой" альтернативой в регэкспе разбивки на заказы (см. выше по файлу) — она
    // захватывает ТОЛЬКО "0.N ", а не остаток строки. Из-за этого, когда после "0.N " идёт
    // "ОПЛАЧЕН (какая-то пометка)" (например ручная дозапись "0.1 ОПЛАЧЕН (не был списан
    // презент)"), этот текст целиком становится ПЕРВОЙ строкой ТЕЛА заказа — а не частью
    // заголовка, как было бы у обычного "N. ОПЛАЧЕН (...)". Поэтому статус-строку нужно
    // узнавать и с пометкой в скобках после неё, а не только "голую" — иначе она не
    // пропускалась бы ни здесь (имя клиента), ни ниже в разборе позиций (см. её же
    // использование в цикле по строкам — та же пометка иначе принимается за начало
    // названия товара и даёт ложное "Товар ... не найден!").
    const STATUS_LINE_REGEX = /^(не\s+)?опла[чт]ен[оа]?\.?(?:\s*\([^)]*\))?\s*$/i;
    let nameIdx = 0;
    while (nameIdx < lines.length - 1 && STATUS_LINE_REGEX.test(lines[nameIdx].trim())) {
      nameIdx++;
    }

    let name;
    if (/^\d+[)\.]\s+/.test(lines[nameIdx]) ||
        (/\d+\s*(?:₽|руб)/.test(lines[nameIdx]) && !['итого', 'доставка'].some(x => lines[nameIdx].toLowerCase().includes(x)))) {
      name = 'Без имени';
    } else {
      name = lines[nameIdx];
    }

    let itemsSell = [];
    let itemsLoss = [];
    let lastItem = null;

    // Строка со скидкой в процентах иногда пишется БЕЗ слова "Промокод"/"Скидка" —
    // просто отдельной строкой вида "(−5%) = −785₽" сразу после "Подытог:". Такая
    // строка содержит цену ("785₽"), поэтому без явного исключения проходила общую
    // проверку isItem ниже и уходила в поиск товара, давая ложное "[!!!] ВНИМАНИЕ: Товар
    // '(−5%) = −785₽' не найден!" — сама скидка при этом всё равно корректно применялась
    // отдельной функцией detectDiscountPercent, это чисто лишнее предупреждение в логе.
    const percentOnlyLineRegex = /^\(?\s*[-−]\s*\d{1,2}\s*%\s*\)?\s*=\s*[-−]?\s*\d+(?:[.,]\d+)?\s*(?:₽|руб)?\s*$/;

    for (const line of lines) {
      const lineLower = line.toLowerCase();
      if (percentOnlyLineRegex.test(line.trim())) continue;
      // Та же строка-статус с пометкой в скобках, что уже пропускается выше при поиске
      // имени клиента (см. STATUS_LINE_REGEX и комментарий там) — без этой проверки ЗДЕСЬ
      // она всё равно доходит до общего поиска товара по каталогу (просто потому, что цикл
      // по строкам идёт по ВСЕМ lines, а не начиная с nameIdx), и если в пометке случайно
      // есть слово вроде "презент"/"подарок" — попадает под isItem/isGift и даёт ложное
      // "[!!!] ВНИМАНИЕ: Товар '...' не найден!".
      if (STATUS_LINE_REGEX.test(line.trim())) continue;
      const isItem = /^\d+[)\.]\s+/.test(line) || (
        /(\d+\s*(?:₽|руб)|\s+[-–—]\s*\d+\s*$|🎁|подарок|презент|\s+[-–—=]\s*0\s*(?:₽|руб)?\s*$)/.test(line) &&
        !['итого', 'подытог', 'доставк', 'скидка', 'выручка', 'оплат', 'промокод'].some(x => lineLower.includes(x))
      );

      if (!isItem) continue;

      let content = line.replace(/^\d+[)\.]\s*/, '').trim();

      // Условный подарок по порогу суммы заказа, например
      // "*На заказ от 12 000 ₽ - Крем сыр Камамбер "spanish cheese" 125гр🎁" или
      // "🎁*На заказ от 15 000 ₽  - Камамбер Käserei 125гр". Здесь "12 000 ₽"/"15 000 ₽" —
      // это ПОРОГ суммы заказа (условие, при котором дают этот подарок), а НЕ цена
      // товара. Без этой проверки строка обрабатывалась общей логикой ниже, которая
      // ошибочно разрезала название по этому числу как будто это цена позиции — в лог
      // попадало "Товар '*На заказ от 12' не найден!", а сам подарок вообще не списывался.
      // Заменяем content на реальное название товара ПОСЛЕ порога — дальше строка
      // обрабатывается как обычная позиция (isGift всё равно распознается ниже по "🎁").
      const thresholdGiftMatch = content.match(/на\s+заказ\s+от\s+[\d\s.,]+\s*(?:₽|руб)?\s*[-–—]\s*(.+)/i);
      if (thresholdGiftMatch) {
        content = thresholdGiftMatch[1].trim();
      }

      const bracketMatch = content.match(/\(([ \d.+]+)\)/);
      let weight;
      // Ещё один формат: "N шт => (X * Y₽/100гр) = Z ₽" — например
      // "1 шт => (1.24 * 390₽/100гр) = 4836 ₽". Тут "N шт" — просто пометка "штучный товар
      // продан", а РЕАЛЬНЫЙ отгружаемый вес (в кг, раз цена весовая, за 100г) — число ВНУТРИ
      // скобок перед "*". Без этой проверки код брал "N" из "N шт" как вес (то есть "1" или
      // "2" вместо настоящих 1.24/2.312 кг) — отгружалось МЕНЬШЕ товара, чем было продано.
      // Проверяем ЭТО раньше "N шт", потому что здесь "шт" — не про количество отгрузки.
      const weightRateMatch = content.match(/\(\s*(\d+(?:[.,]\d+)?)\s*\*\s*\d+(?:[.,]\d+)?\s*(?:₽|руб)?\s*\/\s*100\s*г/i);
      // Новый формат иногда пишет количество штук явно словом "шт" — например
      // "2 шт × 950₽ = 1900 ₽". Это проверяем ПЕРВЫМ (после веса-в-скобках), так как это
      // однозначный сигнал количества, а не цены — в отличие от старого формата
      // "<цена> * <кол-во>" (например "900₽ * 2 = 1800"), где число после "*" — это как
      // раз количество, а не цена (разный порядок множителей).
      // ВАЖНО: \b не работает после кириллицы (кириллица — не \w в JS), поэтому границу
      // после "шт" проверяем вручную через negative lookahead на буквы, а не через \b.
      // КРИТИЧНО: сама КАРТОЧКА товара иногда называется с "N шт" в составе имени — например
      // "Бебибел 16шт" (упаковка из 16 штук, но продаётся и стоит как ОДНА позиция целиком:
      // "Бебибел 16шт — 1650 ₽"). Без доп. проверки код принимал "16" за количество к отгрузке
      // (16 упаковок по 1650₽ вместо одной!). Настоящее указание количества словом "шт" в
      // отчётах ВСЕГДА сопровождается знаком умножения сразу после ("2 шт × 950₽",
      // "3 шт * 1600₽") — а название-с-"шт" в составе карточки товара за ним никогда не
      // следует "*"/"×". Поэтому требуем знак умножения сразу после "N шт".
      const mSht = content.match(/(\d+(?:[.,]\d+)?)\s*шт(?![а-яёА-ЯЁa-zA-Z])\s*[*×]/i);
      // Вес-в-скобках иногда пишется ЦЕЛЫМ числом без дробной части — например
      // "Хамон Себо Иберико Sanchez Montero (блок) (3) * 5500₽/кг = 16500 ₽" (блок хамона
      // весом ровно 3 кг, без дробей — обычно вес дробный вроде "(2.84)", но иногда менеджер
      // взвешивает/пишет ровное число). Проверка выше (`/\d+\.\d+/.test(bracketMatch[1])`)
      // требует ОБЯЗАТЕЛЬНУЮ дробную часть внутри скобок — целый вес "(3)" её не проходил, и
      // код проваливался в самый общий fallback ниже (weight = 1.0), из-за чего отгружался
      // 1 кг вместо 3 — сумма по позициям резко расходилась с "Итого" в отчёте ("НЕСОСТЫКОВКА"
      // на тысячи рублей). Ловим целое число в скобках ОТДЕЛЬНО, но требуем, чтобы сразу после
      // скобки шёл знак умножения (как и в реальном формате "(ВЕС) * ЦЕНА₽/..."), чтобы не
      // спутать со случайной скобкой с числом где-то в названии товара, не означающей вес.
      const bracketIntWeightMatch = content.match(/\(\s*(\d+)\s*\)\s*[*×]\s*\d/);
      // Подарочные списания штучного товара часто пишут количество ПРОСТО через тире, без
      // цены и без знака умножения после "шт" — например "Пармезан ... 200гр — 3 шт 🎁"
      // или "Геитост ... 250гр — 6 шт 🎁" (в отличие от mSht выше, где "N шт" ВСЕГДА
      // сопровождается "*"/"×", т.к. это позиция с ценой за штуку). Без этой проверки такая
      // строка проваливалась в общий fallback ниже (weight = 1.0) и списывалась ОДНА штука
      // вместо реально указанных 3/6/10 — товар оставался висеть на складе, не списанным.
      // Требуем тире СРАЗУ перед числом (как и у обычной цены "название - 1200 ₽" выше),
      // чтобы не спутать с "N шт" В СОСТАВЕ САМОГО названия карточки без тире перед ним
      // (например "Бебибел 8шт — 3 шт🎁": "8шт" — часть названия, тире перед ним нет;
      // настоящее количество на списание — "3 шт" ПОСЛЕ тире).
      const dashShtMatch = content.match(/[-–—]\s*(\d+(?:[.,]\d+)?)\s*шт(?![а-яёА-ЯЁa-zA-Z])/i);
      if (weightRateMatch) {
        weight = parseFloat(weightRateMatch[1].replace(',', '.'));
      } else if (bracketMatch && /\d+\.\d+/.test(bracketMatch[1])) {
        const weights = bracketMatch[1].match(/\d+\.\d+/g) || [];
        weight = weights.length ? pyRound(weights.reduce((s, w) => s + parseFloat(w), 0), 3) : 1.0;
      } else if (bracketIntWeightMatch) {
        weight = parseFloat(bracketIntWeightMatch[1]);
      } else if (mSht) {
        weight = parseFloat(mSht[1].replace(',', '.'));
      } else if (dashShtMatch) {
        weight = parseFloat(dashShtMatch[1].replace(',', '.'));
      } else {
        // ВАЖНО: новый формат иногда пишет знак умножения как "×" (U+00D7), а не "*".
        const mEq = content.match(/[*×]\s*(\d+(?:\.\d+)?)\s*(?:=|$)/);
        if (mEq) {
          weight = parseFloat(mEq[1]);
        } else {
          const mPieces = content.match(/(\d+(?:\.\d+)?)\s*[*×]\s*\d+\s*(?:₽|руб)?/);
          weight = mPieces ? parseFloat(mPieces[1]) : 1.0;
        }
      }

      // ВАЖНО: у первой альтернативы (дефис перед ценой, "Товар - 1200 ₽") ДОЛЖЕН быть
      // пробел перед дефисом (\s[-–—], а не просто [-–—]). Иначе диапазоны веса без
      // пробелов внутри самого названия — например "Sanchez Montero 8-9кг" — ошибочно
      // рвутся посередине (в "...Montero 8"), теряя "-9кг", и потом нечёткий поиск
      // товара промахивается мимо правильной карточки. Настоящий разделитель цены в
      // отчётах всегда пишется как "название ПРОБЕЛ-цена", поэтому это безопасно.
      // "\(\s*\d+\s*\)\s*[*×]" — тот же целый вес-в-скобках, что и bracketIntWeightMatch
      // выше ("(3) * 5500₽/кг"): без этой альтернативы разделитель находился только у
      // "5500₽" ПОСЛЕ знака умножения, и в название товара (pRaw) ошибочно попадал хвост
      // "(3) *" — findProductMeta искал несуществующий товар с таким хвостом в названии.
      const splitRegex = /\s[-–—]\s*\d|\(\s*\d+\.\d+|\(\s*\d+\s*\)\s*[*×]|\s\d+\s*[*×]\s*\d+(?:₽|руб)?|\s\d+\s*(?:₽|руб)/;
      let pRaw = content.split(splitRegex)[0].trim();

      const pRawLetters = pRaw.replace(/[^а-яА-Яa-zA-Z]/g, '');
      if (!pRawLetters && (content.includes('*') || content.includes('×')) && lastItem !== null) {
        const oldQty = lastItem.quantity;
        lastItem.quantity = weight;
        let priceNote = '';
        const contPrice = extractTextPrice(content);
        if (contPrice !== null) {
          const catalogPrice = lastItem._catalog_price !== undefined ? lastItem._catalog_price : contPrice;
          reportPriceMismatch(lastItem._name || '?', contPrice, catalogPrice, stats);
          lastItem.price = contPrice;
          priceNote = `, цена -> ${(contPrice / 100).toFixed(2)} ₽`;
        }
        log(`  [ДОПИСАНО КОЛ-ВО] Строка '${line}' — это продолжение предыдущей позиции. Кол-во исправлено: ${oldQty} -> ${weight}${priceNote}`);
        continue;
      }

      if (['аккумулятор', 'термопакет', 'доставк', 'комиссия', 'купон', 'отправка', 'пакет'].some(x => lineLower.includes(x))) continue;

      // Иногда строка-пометка о подарке пишется БЕЗ названия конкретного товара — просто
      // общая фраза вида "Подарок к заказу 🎁" или "Презент к заказу 🎁" (менеджер не
      // уточнил, что именно подарили — списывать в МоемСкладе нечего). "Презент к заказу" —
      // синоним "Подарок к заказу" с другим словом, но по смыслу то же самое: без этой
      // проверки строка уходила в общий поиск товара и давала ложное
      // "[!!!] ВНИМАНИЕ: Товар 'презент к заказу' не найден!".
      const justLetters = lineLower.replace(/[^а-яa-z]/g, '');
      if (['сырныйпрезент', 'подарок', 'подароккзаказу', 'презент', 'презенткзаказу'].includes(justLetters)) continue;

      const isGift = /🎁|подарок|презент/.test(lineLower) || /[-–—=]\s*0\s*(?:₽|руб)?\s*$/.test(lineLower);

      // "Презент к заказу"/"презент" — синоним "подарок к заказу"/"подарок" (см. комментарий
      // у justLetters выше), но раньше только "подарок..." вычищался из названия перед поиском
      // в каталоге — "презент к заказу"/"презент" оставался приклеенным к названию товара
      // (например "Соус-дип сальса острый El Sabor 315гр - презент к заказу"). Пока хвост
      // короткий, нечёткий поиск обычно всё равно угадывает товар, но это работает "на
      // удачу" — при более длинном/похожем названии лишние слова могут увести точность
      // ниже порога и дать ложное "Товар не найден". Добавляем оба варианта симметрично.
      pRaw = pRaw.replace(/(подарок к заказу|презент к заказу|подарок|презент|сырный презент|🎁|\(?не режем\)?)/gi, '').trim();
      pRaw = pRaw.replace(/[-–—]\s*$/, '').trim();

      if (!pRaw) continue;

      // Иногда сама строка позиции заканчивается ГОТОВЫМ итогом с уже применённой личной
      // скидкой на ЭТУ позицию — например "(4.14) * 295₽/100гр = 12213 ₽ [одним куском] -
      // 15% = 10381" (компенсация за то, что кусок продан целиком, а не строго по
      // заказанному весу — а не скидка на весь заказ). detectDiscountPercent теперь не
      // подхватывает такие built-in-в-строку проценты как общую скидку заказа (см. её
      // комментарий), но саму цену ЭТОЙ позиции всё равно нужно взять по факту "= 10381",
      // а не по ставке ДО скидки — и пометить как уже сниженную, чтобы скидка заказа (если
      // она есть у других позиций) не применилась к ней ещё раз.
      const itemDiscountMatch = content.match(/[-–—]\s*\d{1,2}\s*%\s*=\s*(\d+(?:[.,]\d+)?)\s*(?:₽|руб)?\s*$/i);

      // Пометка "[SALE]" на позиции означает, что ЭТОТ товар уже отпущен по акционной
      // (сниженной) цене сам по себе — обычная автоскидка на заказ (промокод/процент) не
      // должна применяться к нему ЕЩЁ РАЗ поверх уже сниженной цены. Ловим тег ДО того, как
      // findProductMeta нормализует название и "[SALE]" потеряется вместе с остальным текстом.
      const alreadyDiscounted = /\[\s*sale\s*\]/i.test(pRaw) || !!itemDiscountMatch;

      const productData = findProductMeta(pRaw, weight);
      if (!productData) {
        log(`  [!!!] ВНИМАНИЕ: Товар '${pRaw}' не найден!`);
        continue;
      }

      if (isGift) {
        log(`  [🎁 ПОДАРОК] Товар '${pRaw}' (Кол-во: ${weight}) -> В СПИСАНИЕ`);
        const newItem = { quantity: weight, assortment: { meta: productData.meta }, price: productData.buy_price, _name: productData.name };
        itemsLoss.push(newItem);
        lastItem = newItem;
      } else {
        let sellPrice = productData.price;
        if (itemDiscountMatch) {
          const finalTotalRub = parseFloat(itemDiscountMatch[1].replace(',', '.'));
          sellPrice = pyRound((finalTotalRub / (weight || 1)) * 100);
          reportPriceMismatch(productData.name, sellPrice, productData.price, stats);
        } else {
          const textPrice = extractTextPrice(content);
          if (textPrice !== null) {
            reportPriceMismatch(productData.name, textPrice, productData.price, stats);
            sellPrice = textPrice;
          }
        }
        log(`  [OK] Товар '${pRaw}' найден как '${productData.name}' (Кол-во: ${weight}, Цена: ${(sellPrice / 100).toFixed(2)} ₽)${alreadyDiscounted ? ' [уже со скидкой — не участвует в автоскидке заказа]' : ''}`);
        const newItem = { quantity: weight, assortment: { meta: productData.meta }, price: sellPrice, _name: productData.name, _catalog_price: productData.price, _alreadyDiscounted: alreadyDiscounted };
        itemsSell.push(newItem);
        lastItem = newItem;
      }
    }

    // --- УМНОЕ СПАСЕНИЕ ---
    if (!itemsSell.length && !itemsLoss.length) {
      for (const line of lines.slice(1)) {
        const lineLower = line.toLowerCase();
        if (percentOnlyLineRegex.test(line.trim())) continue;
        if (['итого', 'подытог', 'доставка', 'скидка', 'выручка', 'свз', 'сдэк', 'оплат', 'промокод'].some(x => lineLower.includes(x))) continue;

        const productData = findProductMeta(line, 1.0);
        if (productData) {
          let fallbackPrice = productData.price;
          const textPrice = extractTextPrice(line);
          if (textPrice !== null) {
            reportPriceMismatch(productData.name, textPrice, productData.price, stats);
            fallbackPrice = textPrice;
          }
          const alreadyDiscounted = /\[\s*sale\s*\]/i.test(line);
          log(`  [SMART FALLBACK] Скрытый товар спасен: '${line}' -> '${productData.name}' (Цена: ${(fallbackPrice / 100).toFixed(2)} ₽)${alreadyDiscounted ? ' [SALE — не участвует в автоскидке]' : ''}`);
          itemsSell.push({ quantity: 1.0, assortment: { meta: productData.meta }, price: fallbackPrice, _name: productData.name, _catalog_price: productData.price, _alreadyDiscounted: alreadyDiscounted });
        }
      }
    }

    // --- АВТОСКИДКА ---
    if (itemsSell.length) {
      let discountPercent = detectDiscountPercent(block);
      let discountLabel = discountPercent ? `${discountPercent}%` : null;
      let perUnitHandled = false;

      if (!discountPercent) {
        // Скидка "N₽/шт" (фиксированная сумма с единицы, а не с суммы заказа) — у каждого
        // товара в заказе может быть своя цена, поэтому процент считаем ОТДЕЛЬНО для каждой
        // позиции (N от цены именно этой позиции), а не усреднённо по всей сумме заказа.
        const perUnitRub = detectFlatDiscountPerUnitRub(block);
        if (perUnitRub) {
          const discounted = [];
          const excluded = [];
          for (const it of itemsSell) {
            if (isDiscountExcluded(it)) {
              excluded.push(it._name);
              continue;
            }
            const pct = Math.round((perUnitRub / (it.price / 100)) * 10000) / 100;
            it.discount = pct;
            discounted.push(it._name);
          }
          if (discounted.length) log(`  [СКИДКА ${perUnitRub}₽/шт] Применена к: ${discounted.join(', ')}`);
          if (excluded.length) log(`  [СКИДКА ${perUnitRub}₽/шт] НЕ применена (в списке исключений) к: ${excluded.join(', ')}`);
          perUnitHandled = true;
        }
      }

      if (!discountPercent && !perUnitHandled) {
        // Нет процентной и нет "рубли/шт" скидки — проверяем плоскую (рублями), например
        // "-150р" отдельной строкой. Пересчитываем её в эквивалентный процент от суммы
        // позиций ДО скидки и применяем точно так же, как обычную процентную — так реальная
        // выручка в МоемСкладе тоже уменьшается на эту сумму, а не только сверка совпадает
        // "на бумаге".
        const flatDiscountRub = detectFlatDiscountRub(block);
        if (flatDiscountRub) {
          const rawTotalRub = itemsSell.reduce((s, it) => s + it.quantity * it.price, 0) / 100;
          if (rawTotalRub > 0) {
            discountPercent = Math.round((flatDiscountRub / rawTotalRub) * 10000) / 100; // до 2 знаков после запятой
            discountLabel = `${flatDiscountRub}₽ (~${discountPercent}%)`;
          }
        }
      }
      if (discountPercent) {
        const discounted = [];
        const excluded = [];
        for (const it of itemsSell) {
          if (isDiscountExcluded(it)) {
            excluded.push(it._name);
          } else {
            it.discount = discountPercent;
            discounted.push(it._name);
          }
        }
        if (discounted.length) log(`  [СКИДКА ${discountLabel}] Применена к: ${discounted.join(', ')}`);
        if (excluded.length) log(`  [СКИДКА ${discountLabel}] НЕ применена (в списке исключений) к: ${excluded.join(', ')}`);
      }
    }

    // --- ОТГРУЗКА ---
    if (!itemsSell.length) {
      log(`  [ПРОПУСК] В заказе [${header}] (${name}) не найдено товаров. Отгрузка не создана.`);
    } else if (header.toUpperCase().includes('НЕ ОПЛАЧЕН')) {
      log(`  [ПРОПУСК] Заказ [${header}] (${name}) НЕ ОПЛАЧЕН. Отгрузка отменена.`);
    } else {
      const fullDesc = `${header}\n${block.trim()}`;
      const cId = await getOrCreateCounterparty(name, findPhone(block));
      if (cId) {
        if (await demandAlreadyExists(cId, reportDate, fullDesc)) {
          log(`  [ПРОПУСК] Отгрузка [${header}] (${name}) уже есть в МоемСкладе (похоже, отчёт уже обрабатывался) — дубль не создаю.`);
        } else {
          const demandResult = await createDemand(cId, itemsSell, reportDate, fullDesc);
          if (demandResult) {
            log(`  => Отгрузка [${header}] (${name}) успешно создана!${drSuffix()}`);

            const calculatedKop = itemsSell.reduce((s, it) => s + it.quantity * it.price * (1 - (it.discount || 0) / 100), 0);
            const reportKop = extractReportTotalKopecks(block);
            if (reportKop === null) {
              log(`  [ПЛАТЁЖ] В заказе не нашлась строка 'Итого' для сверки — платёж не создаю, проведите вручную.`);
              stats.missingPayments++;
            } else {
              // Допуск на автосоздание платежа: до 100 ₽ (или 0.1% для крупных сумм, что больше) —
              // мелкая погрешность округления больше не блокирует платёж. Но о ЛЮБОМ ненулевом
              // расхождении (даже в пределах допуска) ВСЕГДА печатается уведомление — чтобы
              // руководитель мог сам проверить, откуда оно взялось.
              const toleranceKop = Math.max(10000, calculatedKop * 0.001);
              const diffKop = calculatedKop - reportKop;
              const hasMismatch = Math.abs(diffKop) > 1; // >1 копейки — чтобы не шуметь на копеечные ошибки округления float

              if (hasMismatch) {
                const sign = diffKop >= 0 ? '+' : '';
                log(`  [❗НЕСОСТЫКОВКА] Сумма по позициям (${(calculatedKop / 100).toFixed(2)} ₽) не совпадает с 'Итого' в отчёте ` +
                    `за вычетом доставки/мусора (${(reportKop / 100).toFixed(2)} ₽, разница ${sign}${(diffKop / 100).toFixed(2)} ₽). ` +
                    `Заказ [${header}] (${name}) — проверьте, пожалуйста.`);
                stats.mismatchKop += Math.abs(diffKop);
                stats.mismatchOrders++;
              }

              if (Math.abs(diffKop) <= toleranceKop) {
                const paymentDesc = fullDesc;
                const paymentSum = demandResult.sum !== undefined ? demandResult.sum : pyRound(calculatedKop);
                if (await paymentAlreadyExists(cId, reportDate, paymentDesc)) {
                  log(`  [ПРОПУСК] Входящий платёж для [${header}] (${name}) уже есть в МоемСкладе — дубль не создаю.`);
                } else if (await createPaymentIn(cId, demandResult.meta, paymentSum, reportDate, paymentDesc)) {
                  log(`  => 💰 Входящий платёж на ${(paymentSum / 100).toFixed(2)} ₽ для [${header}] (${name}) создан` +
                      `${hasMismatch ? ' (в пределах допустимой погрешности — см. уведомление выше)' : ' (сумма позиций совпала с отчётом)'}.${drSuffix()}`);
                } else {
                  log(`  [ОШИБКА API] МойСклад не смог создать платёж для '${name}'.`);
                  stats.missingPayments++;
                }
              } else {
                log(`  [ПЛАТЁЖ НЕ СОЗДАН] Расхождение больше допустимого предела (${(toleranceKop / 100).toFixed(2)} ₽) — платёж не создаю, проведите оплату вручную.`);
                stats.missingPayments++;
              }
            }
          } else {
            log(`  [ОШИБКА API] МойСклад не смог создать отгрузку для '${name}'.`);
            stats.missingPayments++;
          }
        }
      }
    }

    // --- СПИСАНИЕ ПОДАРКОВ ---
    if (itemsLoss.length) {
      const fullDesc = `${header}\n${block.trim()}`;
      const fullLossDesc = `🎁 Списание подарков по заказу:\n${fullDesc}`;
      if (await lossAlreadyExists(reportDate, fullLossDesc)) {
        log(`  [ПРОПУСК] Списание подарков для [${header}] (${name}) уже есть в МоемСкладе — дубль не создаю.`);
      } else {
        const lossResult = await createLoss(itemsLoss, reportDate, fullDesc);
        if (lossResult) {
          log(`  => 🎁 Списание подарков для [${header}] (${name}) успешно создано!${drSuffix()}`);
          if (lossResult.id) {
            logLink('     📄 Открыть документ в МоемСкладе →', `https://online.moysklad.ru/app/#loss/edit?id=${lossResult.id}`);
          }
          stats.lossDocs++;
        } else {
          log(`  [ОШИБКА API] МойСклад не смог создать списание подарков для '${name}'.`);
        }
      }
    }
  }

  // --- КОРОТКИЙ ИТОГОВЫЙ ОТЧЁТ ПО ЗАПУСКУ ---
  // Печатается перед 'Готово.', чтобы не листать весь журнал вручную в поисках
  // несостыковок/непроведённых платежей. Специально переиспользуем те же слова-маркеры,
  // что и классификатор цвета log() выше ("НЕСОСТЫКОВКА" -> красный, "ПЛАТЁЖ НЕ СОЗДАН" ->
  // янтарный, "[OK]" -> зелёный), чтобы строки сводки сразу подсвечивались тем же цветом,
  // что и обычные детальные строки того же смысла — без добавления новых CSS-классов.
  log('');
  log('=== ИТОГИ ЗАПУСКА ===');
  if (stats.mismatchOrders > 0) {
    log(`  ❗ НЕСОСТЫКОВКА (сводно): ${stats.mismatchOrders} заказ(ов) с расхождением суммы, итого на ${(stats.mismatchKop / 100).toFixed(2)} ₽ — см. отмеченные заказы выше.`);
  } else {
    log(`  [OK] Несостыковок по суммам за этот запуск не обнаружено.`);
  }
  if (stats.missingPayments > 0) {
    log(`  ПЛАТЁЖ НЕ СОЗДАН (сводно): ${stats.missingPayments} заказ(ов) без входящего платежа — создайте вручную в МоемСкладе.`);
  } else {
    log(`  [OK] Все входящие платежи созданы автоматически.`);
  }
  if (stats.priceCheckCount > 0) {
    // Расхождение цены "в отчёте" vs "в МоемСкладе" иногда означает не опечатку менеджера, а
    // то, что нечёткий поиск товара (findProductMeta) подставил ДРУГУЮ карточку — см. комментарий
    // в reportPriceMismatch. Выносим в сводку тем же маркером "❗ПРОВЕРЬТЕ ЦЕНУ", что и у
    // детальных строк выше, чтобы получить тот же янтарный цвет через общий классификатор.
    log(`  ❗ПРОВЕРЬТЕ ЦЕНУ (сводно): ${stats.priceCheckCount} позици(й) с расхождением цены на общую сумму ${(stats.priceCheckDiffKop / 100).toFixed(2)} ₽ — см. отмеченные позиции выше (возможно, найден не тот товар).`);
  } else {
    log(`  [OK] Расхождений цены (отчёт vs МойСклад) за этот запуск не обнаружено.`);
  }
  log(`  Списаний (подарков) создано: ${stats.lossDocs}`);
  log('');

  log('Готово.');
}

/* ===================== UI ===================== */

const statusEl = document.getElementById('status');
const processBtn = document.getElementById('processBtn');
const settingsStatusEl = document.getElementById('settingsStatus');

document.getElementById('saveSettingsBtn').addEventListener('click', () => {
  saveConfig();
  settingsStatusEl.textContent = '✓ Сохранено на этом устройстве.';
  setTimeout(() => { settingsStatusEl.textContent = ''; }, 3000);
});

document.getElementById('testConnBtn').addEventListener('click', async () => {
  saveConfig();
  if (!CONFIG.workerUrl || !CONFIG.token) {
    settingsStatusEl.textContent = '✗ Укажи адрес прокси и токен.';
    return;
  }
  settingsStatusEl.textContent = 'Проверяю...';
  try {
    const resp = await fetch(apiUrl('/entity/product?limit=1'), { headers: msHeaders() });
    if (resp.ok) {
      const data = await resp.json();
      const total = data.meta ? data.meta.size : '?';
      settingsStatusEl.textContent = `✓ Связь есть! Товаров в базе: ${total}.`;
    } else {
      const text = await resp.text();
      settingsStatusEl.textContent = `✗ Прокси ответил, но МойСклад вернул ошибку ${resp.status}: ${text.slice(0, 150)}`;
    }
  } catch (err) {
    settingsStatusEl.textContent = `✗ Не удалось достучаться до прокси: ${err.message}`;
  }
});

document.getElementById('clearLogBtn').addEventListener('click', clearLog);

document.getElementById('copyLogBtn').addEventListener('click', async () => {
  const text = Array.from(logEl.children).map(el => el.textContent).join('\n') || logEl.textContent;
  try {
    await navigator.clipboard.writeText(text);
    statusEl.textContent = 'Журнал скопирован в буфер обмена.';
  } catch (e) {
    statusEl.textContent = 'Не удалось скопировать автоматически — выдели текст вручную.';
  }
});

processBtn.addEventListener('click', async () => {
  loadConfig();
  if (!configComplete()) {
    statusEl.textContent = '✗ Заполни все настройки подключения перед запуском (см. ⚙️ выше).';
    document.getElementById('settingsBlock').open = true;
    return;
  }
  const reportText = document.getElementById('reportText').value;
  if (!reportText.trim()) {
    statusEl.textContent = '✗ Вставь текст отчёта.';
    return;
  }

  DRY_RUN = document.getElementById('dryRunCheckbox').checked;

  clearLog();
  processBtn.disabled = true;
  processBtn.textContent = DRY_RUN ? 'Проверяю (тест)...' : 'Обрабатываю...';
  statusEl.textContent = '';

  if (DRY_RUN) {
    log('🧪🧪🧪 ТЕСТОВЫЙ ПРОГОН — отгрузки/платежи/списания/контрагенты НЕ создаются в МоемСкладе.');
    log('Каталог, поиск контрагентов и проверка дублей — настоящие (читаются из МоегоСклада), поэтому журнал ниже покажет реальную картину: что было бы найдено, что — создано, что — пропущено как дубль.');
  }

  try {
    await loadProducts();
    await processReport(reportText);
    if (DRY_RUN) {
      log('🧪🧪🧪 КОНЕЦ ТЕСТОВОГО ПРОГОНА — ничего не записано в МойСклад. Снимите галочку и нажмите «Провести», когда будете готовы провести по-настоящему.');
      statusEl.textContent = '✓ Тестовый прогон завершён (ничего не создано). Проверь журнал ниже.';
    } else {
      statusEl.textContent = '✓ Обработка завершена. Проверь журнал ниже.';
    }
  } catch (err) {
    log('  [!!!] КРИТИЧЕСКАЯ ОШИБКА: ' + (err && err.message ? err.message : String(err)));
    statusEl.textContent = '✗ Обработка прервана из-за ошибки — см. журнал.';
  } finally {
    DRY_RUN = false;
    processBtn.disabled = false;
    processBtn.textContent = 'Провести ▶';
  }
});

loadConfig();
</script>
