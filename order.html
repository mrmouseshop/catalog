<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Заказ — Mr. Mouse</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600&family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root { --cream:#F7F3EC; --card:#FDFAF5; --dark:#1C1712; --wine:#6B2737; --gold:#C9A84C; --gray:#8A8279; --border:#E0D8CC; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--cream); color:var(--dark); font-family:'Montserrat',system-ui,sans-serif; }
  header { background:var(--dark); color:var(--gold); padding:14px 16px; font-family:'Cormorant Garamond',Georgia,serif; font-size:24px; font-weight:600; }
  main { max-width:560px; margin:0 auto; padding:16px; }
  .meta { font-size:12px; color:var(--gray); margin:0 0 10px; }
  pre { background:var(--card); border:1px solid var(--border); border-radius:12px; padding:14px; white-space:pre-wrap; word-break:break-word; font:14px/1.55 'Montserrat',system-ui,sans-serif; margin:0; }
  .actions { display:flex; gap:10px; margin-top:12px; flex-wrap:wrap; }
  button { border:0; border-radius:10px; padding:11px 16px; font:600 14px 'Montserrat',system-ui,sans-serif; cursor:pointer; }
  .copy { background:var(--wine); color:#fff; }
  .file { background:#fff; color:var(--dark); border:1.5px solid var(--border); }
  .err { background:#fff3f0; border:1px solid #e6b8ad; color:#8a2c1c; border-radius:12px; padding:14px; font-size:14px; }
  .toast { position:fixed; left:50%; bottom:24px; transform:translateX(-50%); background:var(--dark); color:#fff; padding:10px 16px; border-radius:10px; font-size:13px; opacity:0; transition:opacity .2s; }
  .toast.show { opacity:1; }
</style>
</head>
<body>
<header>Mr.Mouse · заказ</header>
<main>
  <p class="meta" id="meta">Загружаем заказ…</p>
  <pre id="order" hidden></pre>
  <div class="err" id="err" hidden></div>
  <div class="actions" id="actions" hidden>
    <button class="copy" id="copyBtn">Скопировать текст</button>
    <button class="file" id="fileBtn">Скачать .txt</button>
  </div>
</main>
<div class="toast" id="toast"></div>
<script>
// LZ-сжатие строки в URL-безопасный текст (алгоритм LZ-String, © pieroxy, MIT) — компактная версия
var LZU = (function () {
  var KEY = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+-$';
  function compress(input) {
    if (input == null) return '';
    var bits = 6, getChar = function (a) { return KEY.charAt(a); };
    var i, value, dict = {}, toCreate = {}, c = '', wc = '', w = '', enlargeIn = 2, dictSize = 3, numBits = 2,
        data = [], val = 0, pos = 0, ii;
    function writeBit(b) { val = (val << 1) | b; if (pos === bits - 1) { pos = 0; data.push(getChar(val)); val = 0; } else pos++; }
    function writeBits(n, v) { for (var k = 0; k < n; k++) { writeBit(v & 1); v >>= 1; } }
    function emitW() {
      if (Object.prototype.hasOwnProperty.call(toCreate, w)) {
        var code = w.charCodeAt(0);
        if (code < 256) { writeBits(numBits, 0); writeBits(8, code); }
        else { writeBits(numBits, 1); writeBits(16, code); }
        enlargeIn--; if (enlargeIn === 0) { enlargeIn = Math.pow(2, numBits); numBits++; }
        delete toCreate[w];
      } else {
        writeBits(numBits, dict[w]);
      }
      enlargeIn--; if (enlargeIn === 0) { enlargeIn = Math.pow(2, numBits); numBits++; }
    }
    for (ii = 0; ii < input.length; ii++) {
      c = input.charAt(ii);
      if (!Object.prototype.hasOwnProperty.call(dict, c)) { dict[c] = dictSize++; toCreate[c] = true; }
      wc = w + c;
      if (Object.prototype.hasOwnProperty.call(dict, wc)) { w = wc; }
      else { emitW(); dict[wc] = dictSize++; w = String(c); }
    }
    if (w !== '') emitW();
    writeBits(numBits, 2);
    while (true) { val = (val << 1); if (pos === bits - 1) { data.push(getChar(val)); break; } else pos++; }
    return data.join('');
  }
  function decompress(input) {
    if (input == null || input === '') return input == null ? '' : null;
    input = input.replace(/ /g, '+');
    var rev = {}; for (var q = 0; q < KEY.length; q++) rev[KEY.charAt(q)] = q;
    var length = input.length, resetValue = 32, getNext = function (idx) { return rev[input.charAt(idx)]; };
    var dictionary = [], enlargeIn = 4, dictSize = 4, numBits = 3, entry = '', result = [], w, c, bits, resb, maxpower, power,
        data = { val: getNext(0), position: resetValue, index: 1 }, i;
    function read(n) {
      var b = 0, mp = Math.pow(2, n), p = 1;
      while (p !== mp) {
        resb = data.val & data.position; data.position >>= 1;
        if (data.position === 0) { data.position = resetValue; data.val = getNext(data.index++); }
        b |= (resb > 0 ? 1 : 0) * p; p <<= 1;
      }
      return b;
    }
    for (i = 0; i < 3; i++) dictionary[i] = i;
    var next = read(2);
    switch (next) { case 0: c = String.fromCharCode(read(8)); break; case 1: c = String.fromCharCode(read(16)); break; case 2: return ''; }
    dictionary[3] = c; w = c; result.push(c);
    while (true) {
      if (data.index > length) return '';
      c = read(numBits);
      switch (c) {
        case 0: dictionary[dictSize++] = String.fromCharCode(read(8)); c = dictSize - 1; enlargeIn--; break;
        case 1: dictionary[dictSize++] = String.fromCharCode(read(16)); c = dictSize - 1; enlargeIn--; break;
        case 2: return result.join('');
      }
      if (enlargeIn === 0) { enlargeIn = Math.pow(2, numBits); numBits++; }
      if (dictionary[c]) entry = dictionary[c];
      else if (c === dictSize) entry = w + w.charAt(0);
      else return null;
      result.push(entry);
      dictionary[dictSize++] = w + entry.charAt(0);
      enlargeIn--; w = entry;
      if (enlargeIn === 0) { enlargeIn = Math.pow(2, numBits); numBits++; }
    }
  }
  return { compress: compress, decompress: decompress };
})();
// ==ORDERPACK-BEGIN== (этот блок одинаков в index.html и order.html — менять только вместе; проверяет test_order_pack.py)
// 07.10: компактная ссылка на заказ, формат «~». Текст заказа перед LZ-сжатием:
//  1) названия товаров заменяются номером записи каталога (\u0001<Id>\u0002) — страница заказа подставит
//     названия из catalog.json, а снятый с продажи товар так и подпишет;
//  2) постоянные фразы заказа заменяются одним символом из словаря ORDER_DICT_V1 ( + номер).
// СЛОВАРЬ НЕЛЬЗЯ МЕНЯТЬ (порядок и состав): ссылки уже лежат в чатах. Новые фразы — только в новую версию формата.
var ORDER_DICT_V1 = [
  'Комиссия магазина на отправку заказа суммой <5000₽ тк СДЭК: ',
  ' (ориентировочно, перерасчёт произойдёт после фактического оформления доставки)',
  '🌅 ЭКСПРЕСС С УТРА — принять в приоритете, собрать и отправить первым делом при открытии (10:00)',
  'Экспресс с утра (по предоплате) — собрать и отправить в приоритете с открытия (10:00)',
  'Услуги ТК СДЭК оплачиваются мной самостоятельно при получении. (~500₽)',
  'Услуги ТК СДЭК оплачиваются Вами самостоятельно при получении. (~500₽)',
  'Доставка заказа суммой до 5тр в пункт отправления СДЭК из Москвы - ',
  'Способ получения: самовывоз (Марьино, ул. Донецкая, д 19)',
  'Здравствуй, Mr. Mouse, мой заказ:',
  ' за акционную позицию в заказе = −',
  ' — 🎁 подарок за заказ от ',
  'Срочная доставка (по предоплате)',
  'Оплата: по предоплате (СДЭК)',
  'Пункт выдачи/адрес: ',
  'Способ получения: курьером',
  'Способ получения: СДЭК',
  'День доставки: сегодня',
  'ФИО получателя: ',
  'День доставки: ',
  'Оплата: наличными',
  ' (комиссия по условиям магазина)',
  'Ваш заказ:',
  ' на заказ 🔥)',
  'данные прежние',
  'Комментарий: ',
  '₽, бесплатно',
  'Подытог: ',
  'Промокод: ',
  'Телефон: ',
  'Доставка: ',
  '    Куски: ',
  ' [SALE]',
  'Адрес: ',
  'Время: ',
  'Итого: ',
  '₽/100гр',
  ' шт => (',
  ' шт * ',
  '(−',
  '₽/кг',
  '___'
];
// 07.10 (б): в ссылке нет «+» (и «$»): Telegram иногда не делал ссылку кликабельной. «+» -> «_»;
// новая ссылка начинается с «z» (старый формат — с «~», обычное LZ — с A..P; оба по-прежнему открываются).
function orderLinkSafe(s) { return s.replace(/\+/g, '_'); }
// items: [{recId, name}] — товары заказа (и подарок). Возвращает «~…» или null (тогда — обычное LZ без «~»).
function orderPack(text, items) {
  if (/[\u0001\u0002-]/.test(text)) return null;
  var seenId = {}, seenName = {}, list = [];
  (items || []).forEach(function (i) {
    if (!i || !i.name || !/^\d+$/.test(String(i.recId))) return;
    if (seenId[i.recId] || seenName[i.name]) return;
    seenId[i.recId] = seenName[i.name] = true; list.push(i);
  });
  list.sort(function (a, b) { return b.name.length - a.name.length; }); // длинные названия первыми
  var t = text;
  list.forEach(function (i) { t = t.split(i.name).join('\u0001' + i.recId + '\u0002'); });
  ORDER_DICT_V1.forEach(function (ph, k) { t = t.split(ph).join(String.fromCharCode(0xE000 + k)); });
  return 'z' + orderLinkSafe(LZU.compress(t));
}
// packed — без «~». lookup(id) -> { name, available } | null. Возвращает { text, gone:[строки про снятые с продажи] } или null.
function orderUnpack(packed, lookup) {
  var t = LZU.decompress(packed.replace(/_/g, '+'));
  if (!t) return null;
  t = t.replace(/[-]/g, function (ch) { var p = ORDER_DICT_V1[ch.charCodeAt(0) - 0xE000]; return p == null ? '' : p; });
  var gone = [];
  t = t.replace(/\u0001(\d+)\u0002/g, function (m, id) {
    var r = lookup(id);
    if (r && r.available) return r.name;
    if (r) { gone.push(r.name); return r.name + ' (снят с продажи)'; }
    gone.push('товар №' + id); return '[товар №' + id + ' — снят с продажи]';
  });
  return { text: t, gone: gone };
}
// ==ORDERPACK-END==
</script>
<script>
// Страница для менеджера: заказ, отправленный клиентом ссылкой. Текст заказа
// сжат (LZ, как в index.html) и лежит прямо в адресе после "#" — на сервер он не уходит.
window.addEventListener('hashchange', function () { location.reload(); });
(function () {
  var $ = function (id) { return document.getElementById(id); };
  function toast(t) { var el = $('toast'); el.textContent = t; el.classList.add('show'); setTimeout(function () { el.classList.remove('show'); }, 1800); }
  function fail(msg, retry) {
    $('meta').hidden = true; $('err').hidden = false; $('err').textContent = msg;
    if (retry) { var b = document.createElement('button'); b.className = 'copy'; b.style.marginTop = '10px'; b.textContent = 'Повторить'; b.onclick = function () { location.reload(); }; $('err').appendChild(document.createElement('br')); $('err').appendChild(b); }
  }
  var BAD = 'Ссылка повреждена (обрезана при копировании?). Попросите клиента отправить заказ ещё раз.';
  var hash = location.hash.replace(/^#/, '');
  if (!hash) { fail('В ссылке нет заказа. Попросите клиента отправить заказ ещё раз.'); return; }
  var raw; try { raw = decodeURIComponent(hash); } catch (e) { fail(BAD); return; }

  // Каталог нужен только для формата «~» (в нём вместо названий — номера товаров).
  // Снятый с продажи или пропавший из каталога товар подписывается как снятый.
  function loadCatalog() {
    return fetch('catalog.json?t=' + Date.now(), { cache: 'no-store', headers: { 'X-Live': '1' } }).then(function (r) {
      if (!r.ok) throw new Error('catalog ' + r.status);
      return r.json();
    }).then(function (list) {
      var map = {};
      list.forEach(function (rec) {
        var av = typeof rec.Availability === 'boolean' ? rec.Availability : String(rec.Availability || '').trim().toLowerCase() !== 'нет в наличии';
        map[String(rec.Id)] = { name: String(rec.Name || '').trim() || 'Без названия', available: av };
      });
      return function (id) { return map[id] || null; };
    });
  }

  var job;
  if (raw.charAt(0) === '~' || raw.charAt(0) === 'z') {
    job = loadCatalog().then(function (lookup) {
      var r = orderUnpack(raw.slice(1), lookup);
      if (!r) throw new Error('bad');
      return r;
    }, function () { throw new Error('catalog'); });
  } else {
    var text = null; try { text = LZU.decompress(raw.replace(/_/g, '+')); } catch (e) { text = null; }
    job = text ? Promise.resolve({ text: text, gone: [] }) : Promise.reject(new Error('bad'));
  }
  job.then(function (res) {
    var text = res.text;
    $('meta').textContent = 'Заказ от клиента — проверьте и подтвердите в чате.';
    if (res.gone.length) {
      var warn = document.createElement('div'); warn.className = 'err'; warn.style.marginBottom = '10px';
      warn.textContent = '⚠ Снято с продажи: ' + res.gone.join('; ') + '. Эти позиции в тексте ниже помечены.';
      $('meta').insertAdjacentElement('afterend', warn);
    }
    $('order').textContent = text; $('order').hidden = false; $('actions').hidden = false;
    $('copyBtn').onclick = function () {
      (navigator.clipboard ? navigator.clipboard.writeText(text) : Promise.reject()).then(function () { toast('Скопировано'); }, function () {
        var r = document.createRange(); r.selectNodeContents($('order')); var s = getSelection(); s.removeAllRanges(); s.addRange(r); toast('Выделено — скопируйте');
      });
    };
    $('fileBtn').onclick = function () {
      var a = document.createElement('a'); a.href = URL.createObjectURL(new Blob(['\ufeff' + text], { type: 'text/plain' }));
      a.download = 'Заказ Mr.Mouse.txt'; document.body.appendChild(a); a.click(); a.remove();
    };
  }, function (e) {
    if (e && e.message === 'catalog') fail('Не удалось загрузить каталог, чтобы подставить названия товаров. Проверьте интернет и повторите.', true);
    else fail(BAD);
  });
})();
</script>
</body>
</html>
