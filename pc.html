<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mr. Mouse — Элитные сыры и деликатесы</title>
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<meta name="theme-color" content="#1C1712">
<!--
  ПК-версия сайта (status-2026-09-29, чат «PC-версия»).

  Это НЕ копия index.html: вся логика (каталог, цены, корзина, заказ, акции,
  погода) живёт в одном месте — index.html. pc.html при открытии забирает
  index.html, добавляет к нему широкую вёрстку для компьютера (блок #pcCss
  ниже: сетка каталога в несколько колонок, корзина — боковой панелью
  справа, шапка и разделы на всю ширину) и запускает страницу. Поэтому
  любая правка в index.html сразу попадает и в ПК-версию, а править pc.html
  нужно только при изменении самой ПК-раскладки.

  Переключатель версий: выбор хранится в localStorage под ключом mm_view
  ('pc' | 'mobile'). Пока выбора нет — версия определяется автоматически:
  компьютер (широкое окно + мышь) → эта страница, телефон → index.html.
  Менеджерский режим (?manager / флаг менеджера) ПК-версию не использует —
  у менеджера своя рабочая раскладка в index.html.
-->
<style>
  html, body { margin: 0; background: #1C1712; }
  #pcBoot {
    min-height: 100vh; display: flex; align-items: center; justify-content: center;
    flex-direction: column; gap: 14px; color: #c9a84c;
    font: 600 16px Georgia, 'Times New Roman', serif; letter-spacing: .04em;
  }
  #pcBoot i {
    width: 34px; height: 34px; border-radius: 50%;
    border: 3px solid rgba(201,168,76,.25); border-top-color: #c9a84c;
    animation: pcSpin .9s linear infinite;
  }
  @keyframes pcSpin { to { transform: rotate(360deg); } }
</style>

<!-- ============ ПК-вёрстка: подмешивается в index.html при загрузке ============ -->
<style id="pcCss" type="text/plain">
  body.pc-mode {
    max-width: none; margin: 0;
    --pc-max: 1600px;
  }

  /* ---- Шапка: на всю ширину, содержимое — в колонке 1280px ---- */
  body.pc-mode header {
    height: 68px;
    padding: 0 max(24px, calc((100vw - var(--pc-max)) / 2 + 16px));
  }
  body.pc-mode header .logo { font-size: 1.7rem; cursor: pointer; }
  body.pc-mode .cart-btn { padding: 10px 22px; font-size: .86rem; cursor: pointer; }
  body.pc-mode .cart-btn:hover { filter: brightness(1.12); }

  /* Кнопка «Мобильная версия» (в шапке, слева от корзины) */
  .pc-header-right { display: flex; align-items: center; gap: 14px; }
  .pc-switch-btn {
    display: inline-flex; align-items: center; gap: 8px;
    background: transparent; color: var(--gold);
    border: 1.5px solid rgba(201,168,76,.55); border-radius: 22px;
    padding: 9px 16px; font: 600 .78rem var(--font-main);
    cursor: pointer; white-space: nowrap;
    transition: background .15s, border-color .15s;
  }
  .pc-switch-btn:hover { background: rgba(201,168,76,.14); border-color: var(--gold); }
  .pc-switch-btn svg { width: 18px; height: 18px; flex-shrink: 0; }

  /* ---- Шапка-баннер (hero): полоса на всю ширину, содержимое по центру ---- */
  /* Hero: слева — лого с контактами, справа — карусель баннеров 2:1
     (баннер переносится внутрь hero скриптом ниже). Отдельная полоса под
     баннер больше не нужна. */
  /* 02.10: вариант 2 (выбран пользователем) — лого с контактами и баннер
     парой по центру страницы, между ними 64px */
  body.pc-mode .hero {
    display: flex; align-items: center; justify-content: center; gap: 64px;
    padding: 24px max(24px, calc((100vw - var(--pc-max)) / 2 + 16px)) 32px;
    min-height: 320px; box-sizing: border-box;
  }
  body.pc-mode .hero-content { flex: 0 0 360px; margin: 0; }
  body.pc-mode .hero .banner-carousel {
    flex: 0 0 auto; width: min(560px, 40vw); margin: 0;
    position: relative; z-index: 3; box-shadow: 0 8px 28px rgba(0,0,0,.45);
  }
  @media (max-width: 1000px) {
    body.pc-mode .hero { flex-direction: column; gap: 18px; }
    body.pc-mode .hero-content { margin: 0; flex: 0 0 auto; }
    body.pc-mode .hero .banner-carousel { width: min(560px, 100%); }
  }
  body.pc-mode .hero-icon-links.left { left: max(24px, calc((100vw - var(--pc-max)) / 2 + 16px)); top: 18px; z-index: 4; }
  body.pc-mode .hero-icon-btn { width: 42px; height: 42px; }
  body.pc-mode .hero-icon-btn svg { width: 42px; height: 42px; }
  body.pc-mode .hero-logo { cursor: pointer; }
  body.pc-mode .hero-icon-links.right { display: none; }

  /* ---- Колонка контента ---- */
  body.pc-mode .search-wrap,
  body.pc-mode .filters-toggle-row,
  body.pc-mode .filters-panel,
  body.pc-mode .pseudo-header,
  body.pc-mode .categories-wrap,
  body.pc-mode .subcategories,
  body.pc-mode .products {
    width: 100%; max-width: var(--pc-max);
    margin-left: auto; margin-right: auto;
    box-sizing: border-box;
  }
  /* Баннер — родные пропорции 2:1 (как на телефоне, ничего не обрезается),
     но уже колонки: 720px по центру */
  body.pc-mode .banner-carousel {
    aspect-ratio: 2 / 1; border-radius: 14px;
  }
  body.pc-mode .search-wrap { padding: 18px 16px 0; }
  body.pc-mode .filters-toggle-row { padding: 12px 16px 0; }
  body.pc-mode .filters-toggle-btn,
  body.pc-mode .how-to-order-btn { cursor: pointer; padding: 9px 20px; font-size: .78rem; }
  body.pc-mode .how-to-order-btn { flex: 0 0 auto; margin-left: auto; }
  body.pc-mode .filters-panel { padding-left: 16px; padding-right: 16px; }

  /* Категории — переносятся на несколько строк, а не уходят в горизонтальную
     прокрутку (мышью её неудобно листать) */
  body.pc-mode .categories {
    flex-wrap: wrap; overflow-x: visible; row-gap: 4px; padding-top: 14px;
  }
  body.pc-mode .cat-tab { cursor: pointer; font-size: .82rem; padding-bottom: 10px; }
  body.pc-mode .cat-tab:hover { color: var(--wine); }
  body.pc-mode .categories-wrap::before,
  body.pc-mode .categories-wrap::after { display: none; }

  /* ---- Каталог: сетка карточек ---- */
  body.pc-mode .products {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(290px, 1fr));
    gap: 18px; padding: 20px 16px 48px; align-items: start;
  }
  body.pc-mode .products > :not(.product-card) { grid-column: 1 / -1; }
  body.pc-mode .product-card { height: 100%; box-sizing: border-box; }
  body.pc-mode .product-card:hover { box-shadow: 0 8px 24px rgba(28,23,18,.13); }
  body.pc-mode .section-title { font-size: 1.5rem; padding-top: 22px; }

  /* Витрины «Акции» / «Новинки»: карточки крупнее; листаются стрелками ‹ ›
     и бегунком (его можно тянуть мышью). Колесо мыши ряд НЕ листает
     (04.10, решение пользователя) — колесо всегда прокручивает страницу. */
  body.pc-mode .shelf { margin-bottom: 26px; position: relative; }
  body.pc-mode .pc-shelf-arrow {
    position: absolute; top: calc(50% + 10px); transform: translateY(-50%);
    width: 42px; height: 42px; border-radius: 50%; border: 0; z-index: 5;
    background: var(--dark); color: var(--gold); cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 4px 14px rgba(28,23,18,.3); transition: opacity .15s, filter .15s;
  }
  body.pc-mode .pc-shelf-arrow:hover { filter: brightness(1.25); }
  body.pc-mode .pc-shelf-arrow[hidden] { display: none; }
  body.pc-mode .pc-shelf-arrow.left { left: -6px; }
  body.pc-mode .pc-shelf-arrow.right { right: -6px; }
  body.pc-mode .pc-shelf-arrow svg { width: 20px; height: 20px; }
  body.pc-mode .shelf-title { font-size: 1.5rem; }
  body.pc-mode .shelf-more { font-size: .8rem; cursor: pointer; }
  body.pc-mode .shelf-more:hover { text-decoration: underline; }
  body.pc-mode .shelf-row {
    gap: 14px; margin: 0 -16px; padding: 0 16px 12px;
    scrollbar-width: thin; scrollbar-color: rgba(28,23,18,.28) transparent;
  }
  body.pc-mode .shelf-row::-webkit-scrollbar { display: block; height: 8px; }
  body.pc-mode .shelf-row::-webkit-scrollbar-thumb { background: rgba(28,23,18,.28); border-radius: 4px; }
  body.pc-mode .shelf-card { width: 180px; padding: 10px; transition: box-shadow .15s, transform .15s; }
  body.pc-mode .shelf-card:hover { box-shadow: 0 6px 18px rgba(28,23,18,.14); transform: translateY(-2px); }
  body.pc-mode .shelf-name { font-size: .78rem; }
  body.pc-mode .shelf-price { font-size: .78rem; }

  /* ---- Корзина: боковая панель справа вместо нижней шторки ---- */
  body.pc-mode .cart-drawer {
    left: auto; right: 0; top: 0; bottom: 0;
    width: 500px; max-width: 100vw;
    height: 100vh !important; height: 100dvh !important;
    max-height: none;
    border-radius: 20px 0 0 20px;
    transform: translateX(105%);
    transition: transform .35s cubic-bezier(.4,0,.2,1);
    box-shadow: -12px 0 40px rgba(0,0,0,.28);
  }
  body.pc-mode .cart-drawer.open { transform: translateX(0); }
  body.pc-mode .drawer-handle { display: none; }
  body.pc-mode .overlay { background: rgba(28,23,18,.5); }

  /* ---- Плавающие элементы ---- */
  body.pc-mode .circle-scroll-btn { right: 28px; }
  body.pc-mode .scroll-top-btn { bottom: 40px; }
  body.pc-mode .toast { bottom: 40px; }

  /* Инструкция «сохраните на телефон» и «переверните телефон» ПК не нужны */
  body.pc-mode #offlineDownloadModal,
  body.pc-mode .rotate-overlay,
  body.pc-mode .offline-mini-bar,
  body.pc-mode #offlineMiniBarWrap { display: none !important; }

  @media (max-width: 760px) {
    body.pc-mode .products { grid-template-columns: 1fr; }
    .pc-switch-btn span { display: none; }
    .pc-switch-btn { padding: 9px 11px; }
  }
</style>
<!-- ================================================================== -->

<script>
(function () {
  var VIEW_KEY = 'mm_view';
  var MANAGER_KEY = 'mrmouse_manager_v1';

  function go(url) { location.replace(url + location.search + location.hash); }
  function pref() { try { return localStorage.getItem(VIEW_KEY); } catch (e) { return null; } }
  function isManager() {
    try { if (localStorage.getItem(MANAGER_KEY) === '1') return true; } catch (e) {}
    return /(^|[?&])manager(=|&|$)/.test(location.search);
  }
  var phone = (window.matchMedia && matchMedia('(pointer: coarse)').matches) &&
              Math.min(screen.width, screen.height) < 820;

  // Менеджеру ПК-версия не нужна; выбрана мобильная — уходим; выбора нет,
  // а страницу открыли с телефона — тоже на мобильную.
  if (isManager() || pref() === 'mobile' || (pref() !== 'pc' && phone)) {
    go('index.html'); return;
  }

  // На телефоне, где ПК-версию выбрали вручную, показываем её как «сайт для
  // компьютера»: широкий вьюпорт с возможностью щипком приблизить.
  var viewport = phone
    ? '<meta name="viewport" content="width=1280, initial-scale=' + (Math.min(screen.width, screen.height) / 1280).toFixed(3) + ', minimum-scale=0.2, user-scalable=yes">'
    : '<meta name="viewport" content="width=device-width, initial-scale=1.0">';

  // Кнопка возврата на мобильную версию — вставляется в шапку и сама
  // запоминает выбор
  var PC_TAIL = '<script>(function(){' +
    'var hero=document.querySelector(".hero"),bn=document.getElementById("bannerCarousel");' +
    'if(hero&&bn&&bn.parentNode!==hero)hero.appendChild(bn);' +
    'var h=document.querySelector("header"),c=h&&h.querySelector(".cart-btn");' +
    'if(h&&c&&!h.querySelector(".pc-switch-btn")){' +
      'var box=document.createElement("div");box.className="pc-header-right";' +
      'var b=document.createElement("button");b.type="button";b.className="pc-switch-btn";' +
      'b.setAttribute("aria-label","Мобильная версия");' +
      'b.innerHTML=\'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="7" y="2.5" width="10" height="19" rx="2.2"/><path d="M11 18.5h2"/></svg><span>Мобильная версия</span>\';' +
      'b.onclick=function(){try{localStorage.setItem("mm_view","mobile");}catch(e){}' +
        'location.href="index.html"+location.search+location.hash;};' +
      'h.insertBefore(box,c);box.appendChild(b);box.appendChild(c);' +
    '}' +
    // На компьютере окно «Сохраните магазин на телефон» не показываем
    'window.maybeShowOfflinePrompt=function(){};' +
    // 04.10: витрины листаются стрелками ‹ › и бегунком; колесо мыши (и
    // горизонтальный жест тачпада) ряд не листает — прокручивается страница
    'document.addEventListener("wheel",function(e){var r=e.target.closest&&e.target.closest(".shelf-row");' +
      'if(!r)return;if(Math.abs(e.deltaX)>Math.abs(e.deltaY)||e.shiftKey)e.preventDefault();},{passive:false});' +
    'var SVGL=\'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 5 8 12 15 19"/></svg>\';' +
    'var SVGR=\'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 5 16 12 9 19"/></svg>\';' +
    'function upd(sh){var r=sh.querySelector(".shelf-row"),l=sh.querySelector(".pc-shelf-arrow.left"),g=sh.querySelector(".pc-shelf-arrow.right");if(!r||!l||!g)return;' +
      'var max=r.scrollWidth-r.clientWidth;l.hidden=r.scrollLeft<=2;g.hidden=r.scrollLeft>=max-2;}' +
    'function deco(){document.querySelectorAll(".shelf").forEach(function(sh){var r=sh.querySelector(".shelf-row");if(!r)return;' +
      'if(!sh.querySelector(".pc-shelf-arrow")){[["left","Назад",SVGL,-1],["right","Вперёд",SVGR,1]].forEach(function(a){' +
        'var b=document.createElement("button");b.type="button";b.className="pc-shelf-arrow "+a[0];b.setAttribute("aria-label",a[1]);b.innerHTML=a[2];' +
        'b.onclick=function(){var row=sh.querySelector(".shelf-row");row.scrollBy({left:a[3]*Math.max(200,row.clientWidth*0.8),behavior:"smooth"});};sh.appendChild(b);});' +
        'r.addEventListener("scroll",function(){upd(sh);},{passive:true});}' +
      'upd(sh);});}' +
    'deco();var pl=document.getElementById("productList");if(pl)new MutationObserver(function(){deco();}).observe(pl,{childList:true});' +
    'window.addEventListener("resize",deco);' +
  '})();<\/script>';

  function boot(html) {
    var css = document.getElementById('pcCss').textContent;
    var out = html
      .replace(/<meta name="viewport"[^>]*>/, function () { return viewport; })
      .replace('<head>', function () { return '<head><script>window.__PC_MODE=true;<\/script>'; })
      .replace('</head>', function () { return '<style id="pcStyle">' + css + '</style></head>'; })
      .replace(/\n<body>/, function () { return '\n<body class="pc-mode">'; });
    var i = out.lastIndexOf('</body>');
    out = out.slice(0, i) + PC_TAIL + out.slice(i);
    document.open(); document.write(out); document.close();
  }

  function start() {
    fetch('index.html', { cache: 'no-cache' })
      .then(function (r) { if (!r.ok) throw new Error(r.status); return r.text(); })
      .then(boot)
      .catch(function () { go('index.html'); });
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', start); else start();
})();
</script>
</head>
<body>
<div id="pcBoot"><i></i><div>Mr.Mouse</div></div>
<noscript><p style="color:#c9a84c;text-align:center">Для работы сайта нужен JavaScript. <a href="index.html" style="color:#fff">Мобильная версия</a></p></noscript>
</body>
</html>
