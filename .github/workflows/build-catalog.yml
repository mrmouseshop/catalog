name: Обновление кэша каталога (catalog.json)

on:
  schedule:
    # 12.10: раз в сутки, 00:00 UTC (03:00 по Москве) — страховка на случай, если сигнал от NocoDB
    # не дошёл (истёк токен GitHub, сломался вебхук). Раньше было каждые 2 часа в рабочее время.
    - cron: '0 0 * * *'
  # 12.10: сигнал от NocoDB — вебхук на изменение таблицы товаров шлёт запрос в GitHub API
  # (POST /repos/mrmouseshop/catalog/dispatches, event_type = nocodb-update), и каталог
  # пересобирается через 15 минут тишины после последней правки (cron выше — суточная страховка).
  repository_dispatch:
    types: [nocodb-update]
  workflow_dispatch: {} # Кнопка для ручного запуска в Actions

permissions:
  contents: write


# 2026-09-30: версии действий подняты до тех, что работают на Node 24
# (checkout@v6, setup-python@v6, git-auto-commit-action@v7) — Node 20
# удалён с раннеров GitHub 23.09.2026; так же, как в остальных workflow.
jobs:
  # 12.10: сигнал от NocoDB не запускает сборку сразу, а ждёт 15 минут ТИШИНЫ: каждый новый сигнал отменяет
  # предыдущее ожидание и отсчёт начинается заново. Менеджер спокойно доправляет таблицу, и только после
  # последней правки (+15 мин) идёт одна сборка. Расписание и ручной запуск ждать не заставляют.
  wait:
    if: github.event_name == 'repository_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    concurrency:
      group: catalog-wait
      cancel-in-progress: true
    steps:
      - name: Ждём 15 минут без новых правок
        run: sleep 900

  build:
    needs: wait
    # одна сборка за раз, в очереди не больше одного ожидающего
    concurrency:
      group: catalog-build
      cancel-in-progress: false
    # wait пропущен (расписание / ручной запуск) или дождался тишины — собираем; отменён новым сигналом — нет
    if: ${{ always() && (needs.wait.result == 'success' || needs.wait.result == 'skipped') }}
    # 2026-10-01: зафиксирована Ubuntu 24.04 вместо ubuntu-latest — с 19.10.2026
    # ubuntu-latest переезжает на Ubuntu 26.04 (runner-images #14748); переход
    # на новую версию — осознанно, после проверки (например, наличия Python 3.11)
    runs-on: ubuntu-24.04
    timeout-minutes: 5 # Жесткий лимит от зависаний

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Сгенерировать catalog.json
        run: python build_catalog.py
        env:
          NOCODB_TOKEN: ${{ secrets.NOCODB_TOKEN }}

      - name: Подтянуть свежие изменения (параллельно идёт сборка фото)
        run: git pull --rebase --autostash origin main

      - name: Закоммитить обновлённый файл
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: '🗂 Автообновление catalog.json'
          file_pattern: 'catalog.json'
