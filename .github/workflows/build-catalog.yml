name: Обновление кэша каталога (catalog.json)

on:
  schedule:
    # Раньше было '0 6-18/2 * * *' — каждые 2 часа с 06:00 до 18:00 UTC, что
    # на деле давало обновления в 09:00/11:00/13:00/15:00/17:00/19:00/21:00
    # МСК (нечётные часы), а не в 12:00/14:00/16:00/18:00/20:00, на которые
    # реально ориентируются менеджеры — отсюда и путаница вида "почему в
    # 14:00 каталог не обновился" (сам workflow при этом отрабатывал
    # исправно, просто на 14:00 в него никогда не был заложен запуск).
    # Теперь запуск ровно в 12:00, 14:00, 16:00, 18:00, 20:00 и 00:00 МСК
    # (МСК = UTC+3 круглый год, без перехода на летнее время) — это
    # 09:00, 11:00, 13:00, 15:00, 17:00 и 21:00 UTC.
    - cron: '0 9,11,13,15,17,21 * * *'
  workflow_dispatch: {} # Кнопка для ручного запуска в Actions

permissions:
  contents: write

# 2026-09-30: версии действий подняты до тех, что работают на Node 24
# (checkout@v6, setup-python@v6, git-auto-commit-action@v7) — Node 20
# удалён с раннеров GitHub 23.09.2026; так же, как в остальных workflow.
jobs:
  build:
    # 2026-10-01: зафиксирована Ubuntu 24.04 вместо ubuntu-latest — с 19.10.2026
    # ubuntu-latest переезжает на Ubuntu 26.04 (runner-images #14748); переход
    # на новую версию — осознанно, после проверки (например, наличия Python 3.11)
    runs-on: ubuntu-24.04
    timeout-minutes: 5 # Жесткий лимит от зависаний

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Сгенерировать catalog.json
        run: python build_catalog.py
        env:
          NOCODB_TOKEN: ${{ secrets.NOCODB_TOKEN }}

      - name: Закоммитить обновлённый файл
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: '🗂 Автообновление catalog.json'
          file_pattern: 'catalog.json'
