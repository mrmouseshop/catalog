name: Обновить кэш миниатюр, баннеров и прайс-лист

on:
  schedule:
    # 12.10: раз в сутки, 00:10 UTC (03:10 по Москве) — страховка на случай, если сигнал от NocoDB
    # не дошёл (истёк токен GitHub, сломался вебхук и т. п.). Полная пересборка: все фото, баннеры, PDF.
    # Основное обновление идёт по сигналу от NocoDB (repository_dispatch ниже).
    - cron: '10 0 * * *'
  # 12.10: сигнал от NocoDB (вебхук на изменение таблицы товаров -> GitHub API dispatches,
  # event_type = nocodb-update): через 15 минут тишины пересобираются новые/изменённые фото и PDF-прайс.
  repository_dispatch:
    types: [nocodb-update]
  workflow_dispatch: {}   # ручной запуск кнопкой во вкладке Actions — собирается всё и полностью

permissions:
  contents: write

# Запуск по сигналу — инкрементальный (скачиваются только новые/изменённые фото) + PDF.
# Ночной запуск по расписанию и ручной — полная пересборка (FORCE_ALL=1).
env:
  RUN_PHOTOS: 'true'
  RUN_PDF: 'true'
  FORCE_ALL: ${{ github.event_name == 'repository_dispatch' && 'no' || '1' }}

jobs:
  # 12.10: сигнал от NocoDB не запускает сборку сразу, а ждёт 15 минут ТИШИНЫ: каждый новый сигнал отменяет
  # предыдущее ожидание и отсчёт начинается заново. Менеджер спокойно доправляет таблицу, и только после
  # последней правки (+15 мин) идёт одна сборка. Расписание и ручной запуск ждать не заставляют.
  wait:
    if: github.event_name == 'repository_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    concurrency:
      group: photos-wait
      cancel-in-progress: true
    steps:
      - name: Ждём 15 минут без новых правок
        run: sleep 900

  build:
    needs: wait
    # одна сборка за раз, в очереди не больше одного ожидающего
    concurrency:
      group: photos-build
      cancel-in-progress: false
    # wait пропущен (расписание / ручной запуск) или дождался тишины — собираем; отменён новым сигналом — нет
    if: ${{ always() && (needs.wait.result == 'success' || needs.wait.result == 'skipped') }}
    # 2026-10-01: зафиксирована Ubuntu 24.04 вместо ubuntu-latest — с 19.10.2026
    # ubuntu-latest переезжает на Ubuntu 26.04 (runner-images #14748); переход
    # на новую версию — осознанно, после проверки (например, наличия Python 3.11)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      # 2026-09-30: Node 20 снят с поддержки (EOL апрель 2026, удалён с
      # раннеров GitHub 23.09.2026) — ставим актуальную LTS-версию 24
      - uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Установить зависимости
        run: pip install requests pillow reportlab

      - name: Установить шрифт с поддержкой кириллицы (для PDF-прайса)
        if: env.RUN_PDF == 'true'
        run: sudo apt-get update && sudo apt-get install -y fonts-dejavu-core

      - name: Собрать photos.js и папку photos/
        if: env.RUN_PHOTOS == 'true'
        run: python build_photos.py
        env:
          NOCODB_TOKEN: ${{ secrets.NOCODB_TOKEN }}

      - name: Собрать price-list.pdf
        if: env.RUN_PDF == 'true'
        run: python build_price_pdf.py
        env:
          NOCODB_TOKEN: ${{ secrets.NOCODB_TOKEN }}

      - name: Подтянуть свежие изменения (на случай правок во время сборки)
        run: git pull --rebase --autostash origin main

      - name: Закоммитить обновлённые файлы
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: 'Автообновление кэша (фото/прайс) по расписанию'
          file_pattern: 'photos.js photos_manifest.json photos/ banners.js price-list.pdf index.html'
