name: Обновить баннеры карусели

on:
  # 05.11: сигнал от NocoDB — вебхук на таблице Banners шлёт запрос в GitHub API
  # (POST /repos/mrmouseshop/catalog/dispatches, event_type = banners-update); баннеры
  # пересобираются через 5 минут тишины после последней правки. Можно и вручную
  # кнопкой "Run workflow" во вкладке Actions. Расписания нет: баннеры и так
  # пересобираются заодно с фото (build-photos.yml).
  repository_dispatch:
    types: [banners-update]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  # Ждём 5 минут ТИШИНЫ: каждый новый сигнал отменяет предыдущее ожидание.
  wait:
    if: github.event_name == 'repository_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    concurrency:
      group: banners-wait
      cancel-in-progress: true
    steps:
      - name: Ждём 5 минут без новых правок
        run: sleep 300

  build:
    needs: wait
    concurrency:
      group: banners-build
      cancel-in-progress: false
    if: ${{ always() && (needs.wait.result == 'success' || needs.wait.result == 'skipped') }}
    # зафиксирована Ubuntu 24.04 вместо ubuntu-latest (см. остальные workflow)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Установить зависимости
        run: pip install requests pillow

      - name: Собрать только banners.js
        run: python build_photos.py --banners-only
        env:
          NOCODB_TOKEN: ${{ secrets.NOCODB_TOKEN }}

      - name: Закоммитить и отправить (с повтором, если рядом идёт другая сборка)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for f in banners.js index.html; do [ -e "$f" ] && git add -- "$f"; done
          if git diff --cached --quiet; then echo "Изменений нет"; exit 0; fi
          git commit -m "🖼 Обновление баннеров карусели"
          for i in 1 2 3 4 5 6; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            echo "push не удался (попытка $i) — другая сборка успела раньше, повтор"
            sleep $((RANDOM % 10 + 3))
          done
          exit 1
