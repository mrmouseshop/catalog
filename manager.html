<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Mr. Mouse — Менеджер</title>

<!-- Этот файл — отдельная статическая точка входа ТОЛЬКО для того, чтобы
     "Добавить на экран Домой" в iOS Safari создавало ярлык менеджерской
     версии, а не клиентской. Раньше это делалось переключением
     <link rel="manifest"> и apple-mobile-web-app-title через JS в
     setupHomeScreenTarget() (index.html) уже ПОСЛЕ загрузки страницы —
     не сработало на практике: судя по всему, системный экран "Добавить на
     экран Домой" в iOS Safari читает манифест и метатеги из СЫРОГО ответа
     сервера (или из какого-то раннего снапшота документа), а не из живого
     DOM текущей вкладки, так что более поздние правки через JS он просто
     не видит — ровно та же причина, по которой не сработала и более
     ранняя попытка через blob:-URL. Единственный надёжный вариант —
     чтобы нужный <link rel="manifest"> и apple-mobile-web-app-title стояли
     в HTML "как есть", без JS, с самого первого байта ответа — то есть
     в отдельном файле.
     Логика работы: менеджер открывает эту страницу (по прямой ссылке или
     через кнопку в интерфейсе — см. index.html) → добавляет НА ЭКРАН ДОМОЙ
     ИМЕННО ЕЁ (не index.html) → ярлык получает манифест menedger-версии
     (manifest-manager.json, start_url которого указывает сюда же,
     manager.html) → страница мгновенно помечает менеджерский режим и
     переадресует на настоящее приложение (index.html?manager) — сам
     manager.html никакой другой разметки/функциональности не несёт. -->
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="manifest" href="manifest-manager.json">
<meta name="theme-color" content="#1C1712">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Mr. Mouse 👔">
<meta http-equiv="refresh" content="0; url=./index.html?manager">

<style>
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #F7F3EC;
    color: #1C1712;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    font-size: 0.9rem;
    text-align: center;
    padding: 24px;
    box-sizing: border-box;
  }
  a { color: #6B2737; }
</style>
</head>
<body>
  <!-- Первым делом ставим флаг менеджерского режима — если по какой-то
       причине редирект ниже не сработает мгновенно (или JS отключён,
       тогда сработает meta-refresh выше без флага, но index.html и сам
       умеет включить режим по ?manager в адресе), маршрут всё равно верный. -->
  <script>
    try { localStorage.setItem('mrmouse_manager_v1', '1'); } catch (e) {}
    location.replace('./index.html?manager');
  </script>
  <p>Открываем менеджерскую версию… Если страница не открылась сама,
    <a href="./index.html?manager">нажмите сюда</a>.</p>
</body>
</html>
